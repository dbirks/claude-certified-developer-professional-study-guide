- id: F32
  claim: "Google-managed Vertex AI offers global, multi-region (us/eu), and regional endpoints (with a 10% premium for multi-region and regional) and omits server-side fallback, Files API, code execution, web fetch, Batches, and Managed Agents."
  tag: FACT
