  title: "Handle tool calls"
  source: anthropic-docs
  quote: "Claude might then call the tool again with a new tool_use block, so limit how many retries your loop allows."
  accessed: 2026-11-19

- id: F35
  claim: "Combining per-request retry caps with a 10% per-client retry ratio budget reduces worst-case overload amplification from roughly 3x to 1.1x."
  tag: STD
  url: https://sre.google/sre-book/handling-overload/
  title: "Handling Overload — Google SRE Book"
  source: standard
  quote: "However, layering on the per-client retry budget (a 10% retry ratio) reduces the growth to just 1.1x in the general case—a significant improvement."
  accessed: 2026-11-19

