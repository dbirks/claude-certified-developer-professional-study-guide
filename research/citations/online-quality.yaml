- id: "F1"
  claim: "Anthropic combines evaluation with production monitoring, experiments and research."
  tag: "FACT"
  url: "https://www.anthropic.com/research/demystifying-evals-for-ai-agents"
  title: "Demystifying evals for AI agents"
  source: "anthropic-research"
  quote: "Combined with production monitoring, A/B tests, user research, and more, evals provide signals to continue improving Claude Code as it scales."
  accessed: "2026-11-19"
- id: "F2"
  claim: "Anthropic recommends a combination of automated evals, monitoring and human calibration."
  tag: "FACT"
  url: "https://www.anthropic.com/research/demystifying-evals-for-ai-agents"
  title: "Demystifying evals for AI agents"
  source: "anthropic-research"
  quote: "The most effective teams combine these methods: automated evals for fast iteration, production monitoring for ground truth, and periodic human review for calibration."
  accessed: "2026-11-19"
- id: "F3"
  claim: "User-reported failures can be turned into evaluation tasks."
  tag: "FACT"
  url: "https://www.anthropic.com/research/demystifying-evals-for-ai-agents"
  title: "Demystifying evals for AI agents"
  source: "anthropic-research"
  quote: "Converting user-reported failures into test cases ensures your suite reflects actual usage; prioritizing by user impact helps you invest effort where it counts."
  accessed: "2026-11-19"
- id: "F4"
  claim: "Vague grader rubrics introduce inconsistent judgments."
  tag: "FACT"
  url: "https://www.anthropic.com/research/demystifying-evals-for-ai-agents"
  title: "Demystifying evals for AI agents"
  source: "anthropic-research"
  quote: "The same applies to criteria for model-based graders: vague rubrics produce inconsistent judgments."
  accessed: "2026-11-19"
- id: "F5"
  claim: "Agents can be evaluated with code, model, and human graders."
  tag: "FACT"
  url: "https://www.anthropic.com/research/demystifying-evals-for-ai-agents"
  title: "Demystifying evals for AI agents"
  source: "anthropic-research"
  quote: "Agent evaluations typically combine three types of graders: code-based, model-based, and human."
  accessed: "2026-11-19"
- id: "F6"
  claim: "Static suites can track latency, usage, cost per task and errors."
  tag: "FACT"
  url: "https://www.anthropic.com/research/demystifying-evals-for-ai-agents"
  title: "Demystifying evals for AI agents"
  source: "anthropic-research"
  quote: "Once evals exist, you get baselines and regression tests for free: latency, token usage, cost per task, and error rates can be tracked on a static bank of tasks."
  accessed: "2026-11-19"
- id: "F7"
  claim: "Anthropic recommends measuring multiple dimensions of success."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"
  title: "Define success criteria and build evaluations"
  source: "anthropic-docs"
  quote: "Most use cases need multidimensional evaluation along several success criteria."
  accessed: "2026-11-19"
- id: "F8"
  claim: "Anthropic recommends checking reliability of LLM grading before scaling."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"
  title: "Define success criteria and build evaluations"
  source: "anthropic-docs"
  quote: "LLM-based grading: Fast and flexible, scalable and suitable for complex judgment. Test to ensure reliability first, then scale."
  accessed: "2026-11-19"
- id: "F9"
  claim: "Clio extracts facets and clusters conversations by theme."
  tag: "FACT"
  url: "https://www.anthropic.com/research/clio"
  title: "Clio: A system for privacy-preserving insights into real-world AI use"
  source: "anthropic-research"
  quote: "Similar conversations are automatically grouped together by theme or general topic."
  accessed: "2026-11-19"
- id: "F10"
  claim: "Clio applies minimum unique-user or conversation thresholds."
  tag: "FACT"
  url: "https://www.anthropic.com/research/clio"
  title: "Clio: A system for privacy-preserving insights into real-world AI use"
  source: "anthropic-research"
  quote: "We also have a minimum threshold for the number of unique users or conversations, so that low-frequency topics (which might be specific to individuals) aren’t inadvertently exposed."
  accessed: "2026-11-19"
- id: "F11"
  claim: "Clio checks summaries for identifying information before display."
  tag: "FACT"
  url: "https://www.anthropic.com/research/clio"
  title: "Clio: A system for privacy-preserving insights into real-world AI use"
  source: "anthropic-research"
  quote: "As a final check, Claude verifies that cluster summaries don’t contain any overly specific or identifying information before they’re displayed to the human user."
  accessed: "2026-11-19"
- id: "F12"
  claim: "Privacy protection is imperfect."
  tag: "FACT"
  url: "https://www.anthropic.com/research/clio"
  title: "Clio: A system for privacy-preserving insights into real-world AI use"
  source: "anthropic-research"
  quote: "Despite Clio's strong performance in our privacy evaluations, it's possible, as with any real-world privacy system, that our systems might not catch certain kinds of private information."
  accessed: "2026-11-19"
- id: "F13"
  claim: "Repeated fixed-horizon peeking can inflate false positives."
  tag: "FACT"
  url: "https://www.microsoft.com/en-us/research/articles/for-event-based-a-b-tests-why-they-are-special/"
  title: "For Event-based A/B tests: why they are special"
  source: "other"
  quote: "It can inflate the Type I error rate and cause experimenters to see more false positives."
  accessed: "2026-11-19"
- id: "F14"
  claim: "Continuous experiment monitoring needs a suitable sequential method."
  tag: "FACT"
  url: "https://www.microsoft.com/en-us/research/articles/for-event-based-a-b-tests-why-they-are-special/"
  title: "For Event-based A/B tests: why they are special"
  source: "other"
  quote: "Using a traditional A/B test or “fixed-horizon” statistic no longer works, and sequential testing is better suited for continuous monitoring of the experiment."
  accessed: "2026-11-19"
