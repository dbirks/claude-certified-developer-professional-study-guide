- id: "F26"
  claim: "Sample-size calculations can use standard normal percentiles."
  tag: "STD"
  url: "https://www.itl.nist.gov/div898/handbook/prc/section2/prc242.htm"
  title: "Sample sizes required"
  source: "standard"
  quote: "Although the sampling distribution for proportions actually follows a binomial distribution, the normal approximation is used for this derivation."
  accessed: "2026-11-19"
- id: "F27"
  claim: "Interference between units can bias randomized experiments."
  tag: "STD"
  url: "https://research.google/pubs/cluster-randomized-designs-for-one-sided-bipartite-experiments-2/"
  title: "Cluster Randomized Designs for One-Sided Bipartite Experiments"
  source: "other"
  quote: "The conclusions of randomized controlled trials may be biased when the outcome of one unit depends on the treatment status of other units, a problem known as interference."
  accessed: "2026-11-19"
- id: "F28"
  claim: "Sample size planning specifies the minimum difference, power and Type I error."
  tag: "STD"
  url: "https://www.nationalacademies.org/read/10732/chapter/13"
  title: "Appendix A: Sample Size Determination"
  source: "standard"
  quote: "In general, several factors must be known or estimated to calculate sample size: the effect size (usually the difference between two groups), the population standard deviation (for continuous data), the desired power of the experiment to detect the postulated effect, and the significance level."
  accessed: "2026-11-19"
