- id: "F33"
  claim: "Pairwise LLM judge evaluations should flip answer order and recheck whether conclusions hold."
  tag: "REC"
  url: "https://www.anthropic.com/research/building-strong-safety-evaluations"
  title: "Building strong safety evaluations"
  source: "anthropic-research"
  quote: "Graders also favor longer responses and the first option they are shown in a pairwise comparison, so check whether the grader’s scores correlate with response length, and re-run pairwise comparisons such that the options are flipped. And test the grader itself: re-grade a sample of transcripts with a different model or a differently worded rubric, and check that your top-line results hold."
  accessed: "2026-11-19"
- id: "F34"
  claim: "Validate an LLM grader against blinded human labels before trusting it."
  tag: "REC"
  url: "https://www.anthropic.com/research/building-strong-safety-evaluations"
  title: "Building strong safety evaluations"
  source: "anthropic-research"
  quote: "Before trusting a grader, have humans label a sample of the transcripts without seeing the grader’s verdicts, then report the agreement between the human verdicts and the grader’s, corrected for chance."
  accessed: "2026-11-19"
