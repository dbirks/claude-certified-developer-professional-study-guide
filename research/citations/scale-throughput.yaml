- id: "F1"
  claim: "Limits are organization-level, with configurable workspace limits."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "The API enforces service-configured limits at the organization level, but you can also set user-configurable limits for your organization’s workspaces."
  accessed: "2026-11-19"
- id: "F2"
  claim: "Limits use continuously replenished token buckets."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "The API uses the token bucket algorithm to do rate limiting. This means that your capacity is continuously replenished up to your maximum limit, rather than being reset at fixed intervals."
  accessed: "2026-11-19"
- id: "F3"
  claim: "Short bursts can trigger limiting."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "You might hit rate limits over shorter time intervals. For instance, a rate of 60 requests per minute (RPM) might be enforced as 1 request per second. Short bursts of requests can exceed the limit and trigger rate limit errors."
  accessed: "2026-11-19"
- id: "F4"
  claim: "Messages rate limits use RPM, ITPM, and OTPM and return 429."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "The rate limits for the Messages API are measured in requests per minute (RPM), input tokens per minute (ITPM), and output tokens per minute (OTPM) for each model class. If you exceed any of the rate limits, you get a 429 error describing which rate limit was exceeded. When the response has a retry-after header, wait that many seconds before retrying."
  accessed: "2026-11-19"
- id: "F5"
  claim: "Cache reads do not consume default ITPM, but cache writes and uncached input do."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "For rate limit purposes, only input_tokens + cache_creation_input_tokens count toward your ITPM limit, making prompt caching an effective way to increase your throughput."
  accessed: "2026-11-19"
- id: "F6"
  claim: "Input is estimated at start and adjusted to actual usage."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "ITPM rate limits are estimated at the beginning of each request, and the estimate is adjusted during the request to reflect the actual number of input tokens used."
  accessed: "2026-11-19"
- id: "F7"
  claim: "Output limiting counts actual output, not max_tokens."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "OTPM rate limits are evaluated in real time as output tokens are produced, counting only the actual tokens generated. The max_tokens parameter does not factor into OTPM rate limit calculations, so there is no rate limit downside to setting a higher max_tokens value."
  accessed: "2026-11-19"
- id: "F8"
  claim: "Start tier standard Sonnet 5.5 rate limits."
  tag: "VER"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "Claude Sonnet 5.5 | 4,000 | 2,000,000 | 400,000"
  accessed: "2026-11-19"
  version_note: "Claude API documentation as accessed 2026-11-19; limits and availability can change."
