- id: "F11"
  claim: "Some model versions share rate-limit buckets."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "Sonnet 4.x rate limit is a total limit that applies to combined traffic across Sonnet 4.6 and Sonnet 4.5 (deprecated; see Model deprecations). Claude Sonnet 5.5 and Claude Sonnet 5 each have a separate rate limit and are not part of this combined bucket."
  accessed: "2026-11-19"
- id: "F12"
  claim: "Sharp growth can trigger ramp limit 429 despite rate headroom."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "A ramp limit caps how fast your organization’s token usage on a model can grow. After a sharp increase in usage, requests can return a 429 error even while you’re under your ITPM and OTPM rate limits. A burst of requests within a few seconds can also count as a sharp increase."
  accessed: "2026-11-19"
- id: "F13"
  claim: "Ramp limit growth is based on recent peak plus a step."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "Your ramp limit is your organization’s highest per-minute usage of the model in the recent past, plus a step. Each minute you can go up to a step above that peak, so the limit rises as your successful usage grows. It stops rising at your rate limit."
  accessed: "2026-11-19"
- id: "F14"
  claim: "Ramp errors are distinguishable by error_code ramp_limit_exceeded."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "The error type is rate_limit_error, the same as for a rate limit. On the Messages API, error.details.error_code is ramp_limit_exceeded."
  accessed: "2026-11-19"
- id: "F15"
  claim: "Batch has separate API and queued-item limits shared by models."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/api/rate-limits"
  title: "Rate limits"
  source: "anthropic-docs"
  quote: "The Message Batches API has its own set of rate limits, which are shared across all models. These include a requests per minute (RPM) limit to all API endpoints and a limit on the number of batch requests that can be in the processing queue at the same time."
  accessed: "2026-11-19"
