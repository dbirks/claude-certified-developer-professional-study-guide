- id: F1
  claim: "Agent SDK sessions automatically write conversation history—prompts, tool calls, tool results, and model responses—to disk so later runs can return to it."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/sessions
  title: "Work with sessions"
  source: claude-code-docs
  quote: "A session is the conversation history the SDK accumulates while your agent works. It contains your prompt, every tool call the agent made, every tool result, and every response. The SDK writes it to disk automatically so you can return to it later."
  accessed: 2026-11-19

- id: F2
  claim: "Agent SDK sessions persist only the conversation transcript, not filesystem state; file edits require file checkpointing."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/sessions
  title: "Work with sessions"
  source: claude-code-docs
  quote: "Sessions persist the conversation, not the filesystem. To snapshot and revert file changes the agent made, use file checkpointing."
  accessed: 2026-11-19

- id: F3
  claim: "Continue resumes the latest session in the working directory, resume loads a specific session ID, and fork creates a new session from a copy of an existing transcript without modifying the original."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/sessions
  title: "Work with sessions"
  source: claude-code-docs
  quote: "Fork is different: it creates a new session that starts with a copy of the original’s history. The original stays unchanged. Use fork to try a different direction while keeping the option to go back."
  accessed: 2026-11-19

- id: F4
  claim: "Claude Code and the Agent SDK store session transcripts as JSONL files under ~/.claude/projects/<encoded-cwd>/ or $CLAUDE_CONFIG_DIR/projects/."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/sessions
  title: "Work with sessions"
  source: claude-code-docs
  quote: "Claude Code stores sessions under ~/.claude/projects/<encoded-cwd>/*.jsonl. If you set the CLAUDE_CONFIG_DIR environment variable, look under $CLAUDE_CONFIG_DIR/projects/ instead."
  accessed: 2026-11-19

- id: F5
  claim: "Stateless runs can disable disk persistence via persistSession: false in TypeScript or CLAUDE_CODE_SKIP_PROMPT_HISTORY in Python's env option."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/sessions
  title: "Work with sessions"
  source: claude-code-docs
  quote: "Set persistSession: false (TypeScript only). The session exists only in memory for the duration of the call. In Python, set CLAUDE_CODE_SKIP_PROMPT_HISTORY in the env option to suppress transcript writes instead."
  accessed: 2026-11-19

- id: F6
  claim: "The Agent SDK SessionStore interface mirrors JSONL transcripts to an external database, object store, or key-value store for multi-host resumption."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/session-storage
  title: "Persist sessions to external storage"
  source: claude-code-docs
  quote: "A SessionStore adapter lets you mirror those transcripts to your own backend, such as an object store, a key-value store, or a database, so a session created on one host can be resumed on another host running from a matching working directory."
  accessed: 2026-11-19

- id: F7
  claim: "Concurrent append calls to a SessionStore can race on the session summary sidecar and must be serialized with a transaction, CAS, or per-session lock."
  tag: REC
  url: https://code.claude.com/docs/en/agent-sdk/session-storage
  title: "Persist sessions to external storage"
  source: claude-code-docs
  quote: "Concurrent append calls for the same session can race on the sidecar, so serialize the read-fold-write with a transaction, a compare-and-swap, or a per-session lock; the fold itself is pure."
  accessed: 2026-11-19

- id: F8
  claim: "Python ClaudeAgentOptions supports session_store_flush ('batched' or 'eager') and resume_session_at (message UUID truncation) for fine-grained transcript durability and branching."
  tag: VER
  url: https://code.claude.com/docs/en/agent-sdk/python
  title: "Agent SDK reference - Python"
  source: claude-code-docs
  quote: "When resuming, load the conversation only up to and including the message with this UUID. Use with resume, and usually fork_session, to branch from an earlier point. Requires Python Agent SDK 0.2.137 or later"
  accessed: 2026-11-19
  version_note: "Python Agent SDK 0.2.137+ for resume_session_at and resume_drops_turn (with Claude Code CLI v2.1.223+)."

- id: F9
  claim: "A tool call that was still in flight when a Claude Code process crashed is not automatically re-executed upon session resume."
  tag: FACT
  url: https://code.claude.com/docs/en/sessions
  title: "Manage sessions"
  source: claude-code-docs
  quote: "Interrupted tool calls: a tool that was still running when the previous process ended, for example in a crash, doesn’t get rerun when you resume."
  accessed: 2026-11-19

- id: F10
  claim: "Raw JSONL session transcript entry formats are internal to Claude Code and may break across releases."
  tag: FACT
  url: https://code.claude.com/docs/en/sessions
  title: "Manage sessions"
  source: claude-code-docs
  quote: "The entry format is internal to Claude Code and changes between versions, so scripts that parse these files directly can break on any release."
  accessed: 2026-11-19

- id: F11
  claim: "Claude Code creates a file checkpoint before each turn-starting user prompt and retains snapshots for the 100 most recent checkpoints per session."
  tag: FACT
  url: https://code.claude.com/docs/en/checkpointing
  title: "Checkpointing"
  source: claude-code-docs
  quote: "Claude Code keeps file snapshots for the 100 most recent checkpoints in a session."
  accessed: 2026-11-19

- id: F12
  claim: "Claude Code /rewind tracks files modified by file editing tools; files modified solely by Bash commands are not tracked or reverted."
  tag: FACT
  url: https://code.claude.com/docs/en/checkpointing
  title: "Checkpointing"
  source: claude-code-docs
  quote: "Once Claude has edited a file with its file editing tools in your conversation, /rewind undoes changes that Bash commands make to that file afterward. A file that only Bash commands changed isn’t tracked and stays as it is."
  accessed: 2026-11-19

- id: F13
  claim: "In the Agent SDK, rewind_files()/rewindFiles() restores tracked files on disk without rolling back the conversation history."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/file-checkpointing
  title: "Rewind file changes with checkpointing"
  source: claude-code-docs
  quote: "File rewinding restores files on disk to a previous state. It does not rewind the conversation itself. The conversation history and context remain intact after calling rewindFiles() (TypeScript) or rewind_files() (Python)."
  accessed: 2026-11-19

- id: F14
  claim: "Agent SDK file checkpointing does not track subagent edits (except foreground context: fork skills), and fork_session() does not copy file checkpoints from the parent session."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/python
  title: "Agent SDK reference - Python"
  source: claude-code-docs
  quote: "The fork doesn’t include the original session’s file checkpoints, so you can’t rewind it to a checkpoint captured before the fork."
  accessed: 2026-11-19

- id: F15
  claim: "Claude Managed Agents sessions persist conversation history, sandbox state, and outputs server-side until deleted, making hosted Managed Agents ineligible for Zero Data Retention or HIPAA."
