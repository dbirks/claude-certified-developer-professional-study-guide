- id: F26
  claim: "Preserved thinking blocks cryptographically bind to system, tools, and prior messages; altering any prefix before a block triggers a prefix-check failure (400 error) unless prefix_mismatch_behavior='drop_block' is set with the thinking-binding-controls-2026-08-01 beta header."
  tag: VER
  url: https://platform.claude.com/docs/en/build-with-claude/preserved-thinking/fix-bound-to-a-different-conversation
  title: "Fix a thinking block bound to a different conversation"
  source: anthropic-docs
  quote: "Set thinking.block_binding.prefix_mismatch_behavior to \"drop_block\", and send the beta header anthropic-beta: thinking-binding-controls-2026-08-01. Do this on every later request in the conversation, because the API doesn’t store the setting between requests."
  accessed: 2026-11-19
  version_note: "Requires beta header thinking-binding-controls-2026-08-01; also note account-bound thinking drops across unlinked accounts on Fable 5.2, Mythos 5.2, Sonnet 5.5, and Haiku 5.5."

