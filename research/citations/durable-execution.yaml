- id: F25
  claim: "Models with preserved thinking (Fable 5.2, Mythos 5.2, Fable 5.1, Mythos 5.1, Opus 5.5, Sonnet 5.5, Haiku 5.5) reject thinking.type='enabled' with a 400 error and require 'adaptive'."
