- id: F19
  claim: "Managed Agents decouples the stateless harness ('brain'), sandbox/tools ('hands'), and append-only session log so a crashed harness can reboot via wake(sessionId) and resume from getSession(id)."
  tag: FACT
  url: https://www.anthropic.com/research/managed-agents
  title: "Scaling Managed Agents with stable interfaces"
  source: anthropic-research
  quote: "Because the session log sits outside the harness, nothing in the harness needs to survive a crash. When one fails, a new one can be rebooted with wake(sessionId), use getSession(id) to get back the event log, and resume from the last event."
  accessed: 2026-11-19

- id: F20
