- id: F35
  claim: "Adversarial and cyber safety evaluations where safeguards are relaxed must run in an internet-isolated sandbox with real-time monitoring."
  tag: REC
  url: https://www.anthropic.com/research/building-strong-safety-evaluations
  title: "Building strong safety evaluations"
  source: anthropic-research
  quote: "For this reason, evals should be run in a sandbox with no internet access, and monitored in real time so you can stop a run immediately if a model is acting in ways that could result in real-world harm."
  accessed: 2026-11-19

- id: F36
  claim: "Automated red teaming pairs an attack-generating model against a defending model in a red-team/blue-team loop to scale adversarial coverage beyond manual testing."
  tag: REC
  url: https://www.anthropic.com/news/challenges-in-red-teaming-ai-systems
  title: "Challenges in red teaming AI systems"
  source: anthropic-research
  quote: "To do this, we employ a red team / blue team dynamic, where we use a model to generate attacks that are likely to elicit the target behavior (red team) and then fine-tune a model on those red teamed outputs in order to make it more robust to similar types of attack (blue team)."
  accessed: 2026-11-19

