  url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-runner"
  title: "Tool runner (SDK)"
  source: "anthropic-docs"
  quote: "Beta. The tool runner handles the agentic loop, error wrapping, and type safety so you don’t have to. When you need human-in-the-loop approval, custom logging, or conditional execution, use the manual loop instead."
