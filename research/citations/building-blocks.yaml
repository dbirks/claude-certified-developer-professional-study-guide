- id: "F19"
  claim: "Permission allow, ask and deny rules govern tool use."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/permissions"
  title: "Configure permissions"
  source: "claude-code-docs"
  quote: "Allow rules let Claude Code use the specified tool without manual approval. Ask rules prompt for confirmation when Claude tries to use the specified tool. Deny rules prevent Claude Code from using the specified tool."
  accessed: "2026-11-19"
- id: "F20"
  claim: "PreToolUse hook exit 2 blocks a pending call; post-tool events cannot undo it."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/hooks"
  title: "Hooks reference"
  source: "claude-code-docs"
  quote: "Exit with code 2 to block the action. On events that can block, Claude Code stops the action: a PreToolUse hook blocks the tool call, for example, and a UserPromptSubmit hook rejects the prompt."
  accessed: "2026-11-19"
- id: "F21"
  claim: "PostToolUse hook exit 2 cannot block a completed call."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/hooks"
  title: "Hooks reference"
  source: "claude-code-docs"
  quote: "PostToolUse | No | Shows stderr to Claude; the tool already ran"
  accessed: "2026-11-19"
