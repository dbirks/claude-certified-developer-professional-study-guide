  title: "Citations"
  source: anthropic-docs
  quote: "For PDFs: Citations include the page number range (1-indexed). For plain text documents: Citations include the character index range (0-indexed). For custom content documents: Citations include the content block index range (0-indexed) corresponding to the original content list provided."
  accessed: 2026-11-19
- id: F13
  claim: "Custom-content documents preserve developer-defined content blocks as citation units without additional chunking."
