- id: F36
  claim: "Anthropic's reranking experiment retrieved an initial candidate set, scored candidates against the query, selected a smaller top set, and sent that context to Claude."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: |
    The key steps are:
      1. Perform initial retrieval to get the top potentially relevant chunks (we used the top 150);
      2. Pass the top-N chunks, along with the user's query, through the reranking model;
      3. Using a reranking model, give each chunk a score based on its relevance and importance to the prompt, then select the top-K chunks (we used the top 20);
      4. Pass the top-K chunks into the model as context to generate the final result.
  accessed: 2026-11-19

- id: F22
  claim: "Anthropic defines 1 minus recall@20 as the percentage of relevant documents not retrieved within the top 20 chunks."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "We use 1 minus recall@20 as our evaluation metric, which measures the percentage of relevant documents that fail to be retrieved within the top 20 chunks."
  accessed: 2026-11-19
