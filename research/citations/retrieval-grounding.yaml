  url: https://platform.claude.com/docs/en/build-with-claude/citations
  title: "Citations"
  source: anthropic-docs
  quote: "In the document’s source, type is content, and the content field holds a list of content blocks. The API does no further chunking: each text block that you provide is one chunk, the smallest unit that Claude can cite."
