- id: F1
  claim: "Conventional RAG embeds chunks, retrieves them through semantic similarity, and adds selected chunks to the prompt."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "At runtime, when a user inputs a query to the model, the vector database is used to find the most relevant chunks based on semantic similarity to the query. Then, the most relevant chunks are added to the prompt sent to the generative model."
  accessed: 2026-11-19
- id: F2
  claim: "Contextual Retrieval adds chunk-specific explanatory context before embedding and BM25 indexing."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "Contextual Retrieval solves this problem by prepending chunk-specific explanatory context to each chunk before embedding (“Contextual Embeddings”) and creating the BM25 index (“Contextual BM25”)."
  accessed: 2026-11-19
- id: F3
  claim: "Anthropic reported 35% and 49% reductions in top-20 retrieval failure for contextual embedding and contextual embedding plus BM25."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: |
    Our experiments showed that:
      * Contextual Embeddings reduced the top-20-chunk retrieval failure rate by 35% (5.7% → 3.7%).
      * Combining Contextual Embeddings and Contextual BM25 reduced the top-20-chunk retrieval failure rate by 49% (5.7% → 2.9%).
  accessed: 2026-11-19
- id: F4
  claim: "Chunk size, boundaries, and overlap affect retrieval; Voyage and Gemini embeddings were particularly effective in Anthropic's test."
  tag: REC
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "Chunk boundaries: Consider how you split your documents into chunks. The choice of chunk size, chunk boundary, and chunk overlap can affect retrieval performance"
  accessed: 2026-11-19
- id: F5
  claim: "BM25 contributes lexical exact-match retrieval for precise words, phrases, identifiers, and technical terms."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "BM25 (Best Matching 25) is a ranking function that uses lexical matching to find precise word or phrase matches. It's particularly effective for queries that include unique identifiers or technical terms."
  accessed: 2026-11-19
- id: F6
  claim: "Anthropic's reranking flow retrieved up to 150 candidates, reranked them against the query, selected the top 20, and reported a 67% top-20 failure-rate reduction in its setup."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "Specifically, we found that Reranked Contextual Embedding and Contextual BM25 reduced the top-20-chunk retrieval failure rate by 67% (5.7% → 1.9%)."
  accessed: 2026-11-19
- id: F7
  claim: "Reranking adds latency and cost tradeoffs that should be evaluated for the application."
  tag: REC
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "There is an inherent trade-off between reranking more chunks for better performance vs. reranking fewer for lower latency and cost."
  accessed: 2026-11-19
- id: F8
  claim: "Claude Code uses just-in-time agentic retrieval to load relevant data dynamically through tools."
  tag: FACT
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  title: "Effective context engineering for AI agents"
  source: anthropic-engineering
  quote: "Rather than pre-processing all relevant data up front, agents built with the “just in time” approach maintain lightweight identifiers (file paths, stored queries, web links, etc.) and use these references to dynamically load data into context at runtime using tools. Anthropic’s agentic coding solution Claude Code uses this approach to perform complex data analysis over large databases."
  accessed: 2026-11-19
- id: F9
  claim: "Claude Code combines up-front CLAUDE.md context with just-in-time file search, which can avoid stale indexing."
  tag: FACT
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  title: "Effective context engineering for AI agents"
  source: anthropic-engineering
  quote: "Claude Code is an agent that employs this hybrid model: CLAUDE.md files are naively dropped into context up front, while primitives like glob and grep allow it to navigate its environment and retrieve files just-in-time, effectively bypassing the issues of stale indexing and complex syntax trees."
  accessed: 2026-11-19
- id: F10
  claim: "Agentic exploration is slower than precomputed retrieval; a hybrid may retrieve some data up front and allow autonomous exploration when useful."
  tag: REC
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  title: "Effective context engineering for AI agents"
  source: anthropic-engineering
  quote: "In certain settings, the most effective agents might employ a hybrid strategy, retrieving some data up front for speed, and pursuing further autonomous exploration at its discretion. The decision boundary for the ‘right’ level of autonomy depends on the task."
  accessed: 2026-11-19
- id: F11
