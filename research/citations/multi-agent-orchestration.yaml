- id: F1
  claim: "Anthropic distinguishes workflows (predefined code paths orchestrating LLMs and tools) from agents (LLMs dynamically directing their own processes and tool usage)."
  tag: FACT
  url: https://www.anthropic.com/research/building-effective-agents
  title: "Building effective AI agents"
  source: anthropic-research
  quote: "Workflows are systems where LLMs and tools are orchestrated through predefined code paths. Agents, on the other hand, are systems where LLMs dynamically direct their own processes and tool usage, maintaining control over how they accomplish tasks."
  accessed: 2026-11-19

- id: F2
  claim: "Prompt chaining decomposes fixed subtasks sequentially with optional programmatic gates, trading latency for accuracy, while routing classifies inputs to specialized downstream prompts and models."
  tag: REC
  url: https://www.anthropic.com/research/building-effective-agents
  title: "Building effective AI agents"
  source: anthropic-research
  quote: "Prompt chaining decomposes a task into a sequence of steps, where each LLM call processes the output of the previous one. You can add programmatic checks (see \"gate” in the diagram below) on any intermediate steps to ensure that the process is still on track."
  accessed: 2026-11-19

- id: F3
  claim: "Parallelization has two variations: sectioning (independent subtasks in parallel) and voting (running the same task multiple times for diverse outputs or higher confidence)."
  tag: FACT
  url: https://www.anthropic.com/research/building-effective-agents
  title: "Building effective AI agents"
  source: anthropic-research
  quote: "Sectioning: Breaking a task into independent subtasks run in parallel. Voting: Running the same task multiple times to get diverse outputs."
  accessed: 2026-11-19

- id: F4
  claim: "In the orchestrator-workers workflow, a central LLM dynamically determines subtasks from the input rather than using predefined sections, delegates to worker LLMs, and synthesizes results."
  tag: FACT
  url: https://www.anthropic.com/research/building-effective-agents
  title: "Building effective AI agents"
  source: anthropic-research
  quote: "In the orchestrator-workers workflow, a central LLM dynamically breaks down tasks, delegates them to worker LLMs, and synthesizes their results."
  accessed: 2026-11-19

- id: F5
  claim: "The evaluator-optimizer workflow pairs a generator LLM with an evaluator LLM in a feedback loop when clear evaluation criteria exist and iterative refinement adds measurable value."
  tag: REC
  url: https://www.anthropic.com/research/building-effective-agents
  title: "Building effective AI agents"
  source: anthropic-research
  quote: "When to use this workflow: This workflow is particularly effective when we have clear evaluation criteria, and when iterative refinement provides measurable value."
  accessed: 2026-11-19

- id: F6
  claim: "In Anthropic's internal research eval, a multi-agent system with Claude Opus 4 lead and Claude Sonnet 4 subagents outperformed single-agent Opus 4 by 90.2%, and token usage alone explained 80% of BrowseComp variance."
  tag: FACT
  url: https://www.anthropic.com/research/multi-agent-research-system
  title: "How we built our multi-agent research system"
  source: anthropic-research
  quote: "We found that a multi-agent system with Claude Opus 4 as the lead agent and Claude Sonnet 4 subagents outperformed single-agent Claude Opus 4 by 90.2% on our internal research eval."
  accessed: 2026-11-19

- id: F7
  claim: "Multi-agent systems consume roughly 15x more tokens than standard chat interactions (versus ~4x for single agents), requiring high-value tasks with heavy parallelization or context exceeding one window."
  tag: FACT
  url: https://www.anthropic.com/research/multi-agent-research-system
  title: "How we built our multi-agent research system"
  source: anthropic-research
  quote: "In our data, agents typically use about 4× more tokens than chat interactions, and multi-agent systems use about 15× more tokens than chats. For economic viability, multi-agent systems require tasks where the value of the task is high enough to pay for the increased performance."
  accessed: 2026-11-19

- id: F8
  claim: "Lead orchestrators need explicit effort-scaling rules and structured delegation specs (objective, output format, tools/sources, task boundaries) to prevent duplicate work and overinvestment in simple queries."
  tag: REC
  url: https://www.anthropic.com/research/multi-agent-research-system
  title: "How we built our multi-agent research system"
  source: anthropic-research
  quote: "Each subagent needs an objective, an output format, guidance on the tools and sources to use, and clear task boundaries. Without detailed task descriptions, agents duplicate work, leave gaps, or fail to find necessary information."
  accessed: 2026-11-19

- id: F9
  claim: "Combining two layers of parallelism—spawning 3-5 subagents in parallel and executing 3+ tool calls in parallel inside subagents—cut research time by up to 90% for complex queries."
  tag: FACT
  url: https://www.anthropic.com/research/multi-agent-research-system
  title: "How we built our multi-agent research system"
  source: anthropic-research
  quote: "For speed, we introduced two kinds of parallelization: (1) the lead agent spins up 3-5 subagents in parallel rather than serially; (2) the subagents use 3+ tools in parallel. These changes cut research time by up to 90% for complex queries, allowing Research to do more work in minutes instead of hours while covering more information than other systems."
  accessed: 2026-11-19

- id: F10
  claim: "Anthropic uses rainbow deployments to shift traffic from old to new agent versions gradually while both run, avoiding disruption to active agents."
  tag: REC
  url: https://www.anthropic.com/research/multi-agent-research-system
  title: "How we built our multi-agent research system"
  source: anthropic-research
  quote: "Instead, we use rainbow deployments to avoid disrupting running agents, by gradually shifting traffic from old to new versions while keeping both running simultaneously."
  accessed: 2026-11-19

- id: F11
  claim: "Synchronous subagent execution simplifies coordination but blocks the lead agent on the slowest subagent and prevents mid-flight steering; asynchronous execution increases parallelism at the cost of state consistency and error propagation complexity."
  tag: FACT
  url: https://www.anthropic.com/research/multi-agent-research-system
  title: "How we built our multi-agent research system"
  source: anthropic-research
  quote: "Currently, our lead agents execute subagents synchronously, waiting for each set of subagents to complete before proceeding. This simplifies coordination, but creates bottlenecks in the information flow between agents."
  accessed: 2026-11-19

- id: F12
  claim: "Writing large structured subagent outputs directly to an artifact store or filesystem and returning lightweight references to the coordinator avoids 'game of telephone' degradation and token copying overhead."
  tag: REC
  url: https://www.anthropic.com/research/multi-agent-research-system
  title: "How we built our multi-agent research system"
  source: anthropic-research
  quote: "Subagents call tools to store their work in external systems, then pass lightweight references back to the coordinator. This prevents information loss during multi-stage processing and reduces token overhead from copying large outputs through conversation history."
  accessed: 2026-11-19

- id: F13
  claim: "Work should be decomposed by context boundaries rather than problem type (planner/implementer/tester/reviewer), because splitting tightly coupled phases creates handoff loss and excessive coordination token burn."
  tag: REC
  url: https://claude.com/blog/building-multi-agent-systems-when-and-how-to-use-them
  title: "When to use multi-agent systems (and when not to) | Claude by Anthropic"
  source: anthropic-engineering
  quote: "The key insight is to adopt a context-centric view rather than a problem-centric view when decomposing work. Problem-centric decomposition (often counterproductive). Dividing by type of work (one agent writes features, another writes tests, a third reviews code) creates constant coordination overhead. Each handoff loses context."
  accessed: 2026-11-19

- id: F14
  claim: "Verification subagents suffer from the 'early victory problem' (declaring pass after one or two checks) unless given explicit instructions to run full suites, edge cases, and negative tests."
  tag: REC
  url: https://claude.com/blog/building-multi-agent-systems-when-and-how-to-use-them
  title: "When to use multi-agent systems (and when not to) | Claude by Anthropic"
  source: anthropic-engineering
  quote: "The most significant failure mode for verification subagents is marking outputs as passing without thorough testing. The verifier runs one or two tests, observes them pass, and declares success. Mitigation strategies include:"
  accessed: 2026-11-19

- id: F15
  claim: "Non-fork SDK subagents start with a fresh isolated context window containing only their own system prompt, the Agent tool's prompt string, project CLAUDE.md (unless omitClaudeMd is set), and scoped tool definitions, returning only their final message to the parent."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/subagents
  title: "Subagents in the SDK - Claude Code Docs"
  source: claude-code-docs
  quote: "Unless the subagent is a fork, its context window starts fresh, with no parent conversation, but isn’t empty. The only content you pass from parent to subagent is the Agent tool’s prompt string, so include any file paths, error messages, or decisions the subagent needs directly in that prompt."
  accessed: 2026-11-19

- id: F16
  claim: "Multiple SDK subagents can run concurrently, so independent subtasks can finish in the time of the slowest subagent rather than the sum."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/subagents
  title: "Subagents in the SDK - Claude Code Docs"
  source: claude-code-docs
  quote: "multiple subagents can run concurrently, so independent subtasks finish in the time of the slowest one rather than the sum of all of them."
  accessed: 2026-11-19

- id: F17
  claim: "Setting CLAUDE_AGENT_SDK_DISABLE_BUILTIN_AGENTS=1 removes the built-in general-purpose subagent; a call without subagent_type then fails."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/subagents
  title: "Subagents in the SDK - Claude Code Docs"
  source: claude-code-docs
