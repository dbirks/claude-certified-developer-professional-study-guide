- id: F18
  claim: "SDK subagent depth is bounded by CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH, which defaults to three layers and can be set to 1 to prevent workers from spawning further subagents."
  tag: VER
  url: https://code.claude.com/docs/en/agent-sdk/subagents
  title: "Subagents in the SDK - Claude Code Docs"
  source: claude-code-docs
  quote: "Depth | CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH | 3 layers of subagents below your main agent. 1 stops your subagents from spawning any of their own | Leaves a subagent at the bottom layer unable to spawn, so it does its delegated work itself."
  accessed: 2026-11-19
  version_note: "Requires TypeScript Agent SDK v0.3.219+ or Python Agent SDK v0.2.127+ (Claude Code v2.1.219+)."

- id: F19
