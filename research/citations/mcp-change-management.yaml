[
  {
    "id": "F1",
    "claim": "MCP 2026-07-28 is a published release.",
    "tag": "STD",
    "url": "https://blog.modelcontextprotocol.io/posts/2026-07-28/",
    "title": "The 2026-07-28 Specification",
    "source": "mcp-spec",
    "quote": "Today, we’re officially pushing the release button on the next version of the MCP specification, 2026-07-28, along with the SDKs that will allow you to start building clients and servers right away.",
    "accessed": "2026-11-19"
  },
  {
    "id": "F2",
    "claim": "The 2026 revision uses per-request versions, not initialization negotiation.",
    "tag": "STD",
    "url": "https://blog.modelcontextprotocol.io/posts/2026-07-28/",
    "title": "The 2026-07-28 Specification",
    "source": "mcp-spec",
    "quote": "Each request now travels on its own, carrying its protocol version, client identity, and client capabilities in _meta.",
    "accessed": "2026-11-19"
  },
  {
    "id": "F3",
    "claim": "The 2025 revision negotiates the client version in initialize.",
    "tag": "STD",
    "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/lifecycle",
    "title": "Lifecycle",
    "source": "mcp-spec",
    "quote": "In the initialize request, the client MUST send a protocol version it supports. This SHOULD be the latest version supported by the client. If the server supports the requested protocol version, it MUST respond with the same version.",
    "accessed": "2026-11-19"
  },
  {
    "id": "F4",
    "claim": "The client should disconnect if it cannot support the server counteroffer.",
    "tag": "STD",
    "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/lifecycle",
    "title": "Lifecycle",
    "source": "mcp-spec",
    "quote": "If the client does not support the version in the server’s response, it SHOULD disconnect.",
    "accessed": "2026-11-19"
  },
  {
    "id": "F5",
    "claim": "Streamable HTTP replaced the earlier HTTP+SSE transport.",
    "tag": "STD",
    "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/transports",
    "title": "Transports",
    "source": "mcp-spec",
    "quote": "This replaces the HTTP+SSE transport from protocol version 2024-11-05.",
    "accessed": "2026-11-19"
  },
  {
    "id": "F6",
    "claim": "Claude Code deprecates the legacy SSE transport.",
    "tag": "REC",
    "url": "https://code.claude.com/docs/en/mcp",
    "title": "Connect Claude Code to tools via MCP",
    "source": "claude-code-docs",
    "quote": "The SSE (Server-Sent Events) transport is deprecated. Use HTTP servers instead, where available.",
    "accessed": "2026-11-19"
  },
  {
    "id": "F7",
    "claim": "The 2025 authorization profile requires RFC 9728 metadata and discovery.",
    "tag": "STD",
    "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization",
    "title": "Authorization",
    "source": "mcp-spec",
    "quote": "MCP servers MUST implement OAuth 2.0 Protected Resource Metadata (RFC9728). MCP clients MUST use OAuth 2.0 Protected Resource Metadata for authorization server discovery.",
    "accessed": "2026-11-19"
  },
  {
    "id": "F8",
    "claim": "Clients implement resource indicators for the intended resource.",
    "tag": "STD",
    "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization",
    "title": "Authorization",
    "source": "mcp-spec",
    "quote": "MCP clients MUST implement Resource Indicators for OAuth 2.0 as defined in RFC 8707 to explicitly specify the target resource for which the token is being requested.",
    "accessed": "2026-11-19"
  },
  {
    "id": "F9",
    "claim": "Servers validate audience and must not accept or transit foreign tokens.",
    "tag": "STD",
    "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization",
    "title": "Authorization",
    "source": "mcp-spec",
    "quote": "MCP servers MUST only accept tokens that are valid for use with their own resources. MCP servers MUST NOT accept or transit any other tokens.",
    "accessed": "2026-11-19"
  },
  {
    "id": "F10",
    "claim": "An MCP server must not pass the client token through.",
    "tag": "STD",
    "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization",
    "title": "Authorization",
    "source": "mcp-spec",
    "quote": "The MCP server MUST NOT pass through the token it received from the MCP client.",
    "accessed": "2026-11-19"
  },
  {
    "id": "F11",
    "claim": "In the handshake-era spec servers advertising listChanged should notify on changes.",
    "tag": "STD",
    "url": "https://modelcontextprotocol.io/specification/2025-11-25/server/tools",
    "title": "Tools",
    "source": "mcp-spec",
    "quote": "When the list of available tools changes, servers that declared the listChanged capability SHOULD send a notification:",
    "accessed": "2026-11-19"
  },
  {
    "id": "F12",
    "claim": "In the modern era list-change delivery requires an opted-in subscription.",
    "tag": "STD",
    "url": "https://ts.sdk.modelcontextprotocol.io/v2/migration/support-2026-07-28",
    "title": "Supporting protocol revision 2026-07-28",
    "source": "mcp-spec",
    "quote": "The 2026-07-28 revision delivers tools/prompts/resources list_changed and resources/updated only on a subscriptions/listen stream the client opened — the server never sends an un-requested notification type.",
    "accessed": "2026-11-19"
  },
  {
