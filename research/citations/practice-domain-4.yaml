  title: "Model IDs and versioning"
  source: anthropic-docs
  quote: "For the 4.6 generation and later, the dateless ID is the canonical model ID for that release. It maps to a single, fixed model snapshot. Anthropic does not update the weights or configuration of an existing model ID. When an updated version is available, it ships under a new model ID."
  accessed: 2026-11-19
  version_note: "Applies to Claude 4.6 generation and later; pre-4.6 dateless strings were aliases pointing to dated snapshots."

