  url: https://platform.claude.com/docs/en/manage-claude/opentelemetry
  title: "OpenTelemetry tracing for the Claude API"
  source: anthropic-docs
  quote: "The Claude API and the SDK can trace your Messages API requests, tool uses, and Managed Agents sessions with OpenTelemetry (OTel). You can view these traces in the observability platform you already have. Use them to debug failed or slow requests, track token spend and latency, and build evals from real traffic."
  accessed: 2026-11-19
  version_note: "OpenTelemetry export is in beta on the Claude API and SDK."

- id: F53
  claim: "Claude Code managed settings override user, project, local, and --settings configurations, making them the authoritative fleet-wide control plane during security or tool incidents."
