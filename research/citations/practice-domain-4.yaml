- id: F1
  claim: "A tool-use assistant turn must be followed by a matching tool_result for each tool_use id, with tool results first in the user content; violating the contract can produce a 400."
  tag: FACT
  url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls
  title: "Handle tool calls"
  source: anthropic-docs
  quote: "In the user message containing tool results, the tool_result blocks must come FIRST in the content array."
  accessed: 2026-11-19

- id: F2
  claim: "When responding to parallel client tool calls, return all tool results together in one user message."
  tag: REC
  url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/parallel-tool-use
  title: "Parallel tool use"
  source: anthropic-docs
  quote: "Correct: all tool results together in a single user message"
  accessed: 2026-11-19

- id: F3
  claim: "A `tool_result.tool_use_id` identifies the tool call it answers; missing or misplaced results are a documented cause of the unresolved-tool 400."
  tag: FACT
  url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/troubleshooting-tool-use
  title: "Troubleshooting tool use"
  source: anthropic-docs
  quote: "tool_use ids were found without tool_result blocks immediately after | Missing tool_result for some tool_use IDs, or tool_result is not the first content block in the user message | Return one tool_result for every tool_use block in the assistant response. Put tool_result blocks before any text."
  accessed: 2026-11-19

- id: F4
  claim: "For `pause_turn`, replay the paused assistant content unchanged, keep the same tools, and do not append a user message."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons
  title: "Stop reasons and fallback"
  source: anthropic-docs
  quote: "Keep the earlier messages and add the response’s content unchanged as an assistant message, including any server_tool_use block that has no result block."
  accessed: 2026-11-19

- id: F5
  claim: "Tool-use continuations must preserve the latest assistant thinking blocks exactly; changing or omitting them can trigger a 400."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/thinking-troubleshooting
  title: "Thinking troubleshooting"
  source: anthropic-docs
  quote: "Echo the assistant turn back verbatim, thinking blocks included."
  accessed: 2026-11-19

- id: F6
  claim: "A `tool_use` stop reason means the model invoked one or more tools."
