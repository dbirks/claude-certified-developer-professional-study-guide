  source: anthropic-docs
  quote: "set fallbacks to \"default\", and the API retries a declined request on the fallback model Anthropic recommends for its refusal category. For categories with no recommended fallback, the refusal stands. Claude Haiku 5.5 has no server-side fallback, so for it use client-side fallback with the SDK middleware or write the retry yourself."
  accessed: 2026-11-19
  version_note: "Beta feature using header server-side-fallback-2026-07-01 on Claude API and Google Cloud (Anthropic managed)."

