- id: F1
  claim: "Claude API supports static API keys, Workload Identity Federation, and App Attest, with WIF intended for production workloads that can use platform identity."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/authentication
  title: "Authentication"
  source: anthropic-docs
  quote: "The Claude API supports three ways to authenticate requests:"
  accessed: 2026-11-19

- id: F2
  claim: "Workspace-scoped Claude API keys are restricted to that workspace and do not need an explicit workspace ID on requests."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/authentication
  title: "Authentication"
  source: anthropic-docs
  quote: "API keys that are created for a specific workspace only work in that workspace, and API requests using these keys can omit the workspace ID."
  accessed: 2026-11-19

- id: F3
  claim: "Workspace-unscoped API keys require the anthropic-workspace-id request header, and an omitted header returns a 400 invalid_request_error."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/authentication
  title: "Authentication"
  source: anthropic-docs
  quote: "If your API key isn’t scoped to a workspace, you must specify the workspace ID in the anthropic-workspace-id header for each request."
  accessed: 2026-11-19

- id: F4
  claim: "The Admin API accepts an Admin API key, org:admin OAuth token, or unscoped personal/service-account key; workspace-scoped keys do not qualify."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/admin-api
  title: "Admin API"
  source: anthropic-docs
  quote: "The Admin API accepts any of these three credentials:"
  accessed: 2026-11-19

- id: F5
  claim: "Claude API Workload Identity Federation exchanges an upstream OIDC JWT for a short-lived Anthropic token bound to an organization service account."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
  title: "Workload Identity Federation"
  source: anthropic-docs
  quote: "Your workload presents a signed JWT from your identity provider. Anthropic validates it against trust rules you configure in the Claude Console and returns a short-lived Anthropic access token bound to a service account in your organization."
  accessed: 2026-11-19

- id: F6
  claim: "The Anthropic SDK sends the JWT to POST /v1/oauth/token using the RFC 7523 jwt-bearer grant, then refreshes the access token before expiry."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
  title: "Workload Identity Federation"
  source: anthropic-docs
  quote: "The SDK posts the JWT to POST /v1/oauth/token using the RFC 7523 jwt-bearer grant."
  accessed: 2026-11-19

- id: F7
  claim: "A Claude service account is a non-human identity; its workspace memberships control which workspaces a federation rule can target and where usage is attributed."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
  title: "Workload Identity Federation"
  source: anthropic-docs
  quote: "At exchange time, Anthropic checks that the federation rule’s workspace matches one of the service account’s workspace memberships."
  accessed: 2026-11-19

- id: F8
  claim: "Federation rules choose OAuth scope and token lifetime; token_lifetime_seconds is bounded from 60 to 86,400 seconds, with a 3,600-second default."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
  title: "Workload Identity Federation"
  source: anthropic-docs
  quote: "The rule also sets token_lifetime_seconds (60 to 86,400, default 3,600)."
  accessed: 2026-11-19

- id: F9
  claim: "The direct environment-variable WIF path requires federation rule ID, organization ID, and an identity token file or inline identity token."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/wif-reference
  title: "WIF reference"
  source: anthropic-docs
  quote: "The direct environment-variable federation path activates only when ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, and one of ANTHROPIC_IDENTITY_TOKEN_FILE or ANTHROPIC_IDENTITY_TOKEN are all set."
  accessed: 2026-11-19

- id: F10
  claim: "Claude SDK credential precedence puts ANTHROPIC_API_KEY / ANTHROPIC_AUTH_TOKEN ahead of WIF environment credentials, so leftover static credentials silently override federation."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
  title: "Workload Identity Federation"
  source: anthropic-docs
  quote: "ANTHROPIC_API_KEY sits above the federation tiers, so a leftover key in the environment silently overrides federation."
  accessed: 2026-11-19

- id: F11
  claim: "The WIF SDK refreshes its token ahead of expiry and rereads the identity token file on each exchange, allowing projected identity tokens to rotate."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
  title: "Workload Identity Federation"
  source: anthropic-docs
  quote: "Because the SDK rereads ANTHROPIC_IDENTITY_TOKEN_FILE on every exchange, it automatically picks up rotated projected tokens (Kubernetes service-account tokens, for example, rotate well before their exp)."
  accessed: 2026-11-19

- id: F12
  claim: "For Claude Code on Amazon Bedrock, Claude Code uses the default AWS SDK credential chain, including instance-profile and task credentials."
  tag: FACT
  url: https://code.claude.com/docs/en/amazon-bedrock
  title: "Claude Code on Amazon Bedrock"
  source: claude-code-docs
  quote: "Claude Code uses the default AWS SDK credential chain."
  accessed: 2026-11-19

- id: F13
  claim: "Claude Code supports an awsAuthRefresh command for refreshing Bedrock AWS credentials when STS validation fails."
  tag: FACT
  url: https://code.claude.com/docs/en/settings-reference
  title: "All settings"
  source: claude-code-docs
  quote: "Claude Code checks the current credentials against STS first and runs the command only when that check fails, then reads the refreshed .aws directory."
  accessed: 2026-11-19

- id: F14
  claim: "Claude Code on Google Cloud Agent Platform can authenticate with Application Default Credentials, a service-account key file, or credentials already in the environment."
  tag: FACT
  url: https://code.claude.com/docs/en/google-vertex-ai
  title: "Claude Code on Google Cloud's Agent Platform"
  source: claude-code-docs
  quote: "Choose how you authenticate to Google Cloud: Application Default Credentials from gcloud, a service account key file, or credentials already in your environment."
  accessed: 2026-11-19

- id: F15
  claim: "Claude Code on Microsoft Foundry supports Entra ID via the Azure SDK default credential chain, so it need not store a Foundry API key."
  tag: FACT
  url: https://code.claude.com/docs/en/microsoft-foundry
  title: "Claude Code on Microsoft Foundry"
  source: claude-code-docs
  quote: "Microsoft Entra ID: Claude Code gets tokens through the Azure SDK default credential chain, for example from an az login session, so there’s no API key to store"
  accessed: 2026-11-19

- id: F16
  claim: "Claude Code apiKeyHelper emits a dynamic credential in both X-Api-Key and Authorization: Bearer headers."
  tag: FACT
  url: https://code.claude.com/docs/en/settings-reference
  title: "All settings"
  source: claude-code-docs
  quote: "Claude Code runs the command through the system shell, /bin/sh on macOS and Linux and cmd on Windows, and sends its output as both the X-Api-Key and Authorization: Bearer headers."
  accessed: 2026-11-19

- id: F17
  claim: "Claude Code apiKeyHelper credentials are cached for five minutes by default and re-fetched on Anthropic API 401 or 403 responses."
  tag: FACT
  url: https://code.claude.com/docs/en/settings-reference
  title: "All settings"
  source: claude-code-docs
  quote: "After the cache lifetime, five minutes by default or the interval you set with CLAUDE_CODE_API_KEY_HELPER_TTL_MS. When a request to the Anthropic API, directly or through an LLM gateway, fails with 401 or 403."
  accessed: 2026-11-19

- id: F18
  claim: "For MCP HTTP transports, the protocol defines OAuth authorization on behalf of resource owners; stdio implementations should retrieve credentials from the environment."
  tag: STD
  url: https://modelcontextprotocol.io/specification/2025-06-18/basic/authorization
  title: "Authorization"
  source: mcp-spec
  quote: "The Model Context Protocol provides authorization capabilities at the transport level, enabling MCP clients to make requests to restricted MCP servers on behalf of resource owners."
  accessed: 2026-11-19

- id: F19
  claim: "MCP servers must validate that incoming access tokens were issued for that server as the intended audience."
  tag: STD
  url: https://modelcontextprotocol.io/specification/2025-06-18/basic/authorization
  title: "Authorization"
  source: mcp-spec
  quote: "MCP servers MUST validate that access tokens were issued specifically for them as the intended audience, according to RFC 8707 Section 2."
  accessed: 2026-11-19

- id: F20
  claim: "An MCP server must not accept or transit an upstream/client token as token passthrough; downstream APIs require a separately issued token."
  tag: STD
  url: https://modelcontextprotocol.io/specification/2025-06-18/basic/authorization
  title: "Authorization"
  source: mcp-spec
  quote: "MCP servers MUST NOT accept or transit any other tokens."
  accessed: 2026-11-19

- id: F21
  claim: "The Claude Messages API MCP connector accepts an authorization_token supplied by the API consumer, who handles OAuth acquisition and refresh."
  tag: FACT
  url: https://platform.claude.com/docs/en/agents-and-tools/mcp-connector
  title: "MCP connector"
  source: anthropic-docs
  quote: "API consumers are expected to handle the OAuth flow and obtain the access token prior to making the API call, and to refresh the token as needed."
  accessed: 2026-11-19

- id: F22
  claim: "Claude Code permission policies support fine-grained allow, ask, and deny decisions, including managed policies and version-controlled project rules."
  tag: FACT
  url: https://code.claude.com/docs/en/permissions
  title: "Configure permissions"
  source: claude-code-docs
  quote: "Claude Code supports fine-grained permissions so that you can specify exactly what the agent is allowed to do and what it can’t."
  accessed: 2026-11-19

- id: F23
  claim: "Claude Code OTel has a claude_code.tool_decision event for accepted or rejected tool permission decisions, with tool_use_id for correlation."
  tag: FACT
  url: https://code.claude.com/docs/en/monitoring-usage
  title: "Monitoring"
  source: claude-code-docs
  quote: "Logged when a tool permission decision is made (accept/reject). Event Name: claude_code.tool_decision"
  accessed: 2026-11-19

- id: F24
  claim: "Claude Code OTel correlates tool decisions/results to user prompts and sessions, but direct API key and cloud-provider sessions require customer-supplied end-user identity attributes."
  tag: FACT
  url: https://code.claude.com/docs/en/monitoring-usage
  title: "Monitoring"
  source: claude-code-docs
  quote: "When Claude Code authenticates with a direct API key, or against Amazon Bedrock, Google Cloud’s Agent Platform, or Microsoft Foundry, there is no Claude account in the session and only user.id and session.id are populated."
  accessed: 2026-11-19

- id: F25
  claim: "Claude Code's tool_decision and tool_result events can record MCP server/tool identity and arguments when OTEL_LOG_TOOL_DETAILS=1 is enabled."
  tag: FACT
  url: https://code.claude.com/docs/en/monitoring-usage
  title: "Monitoring"
  source: claude-code-docs
  quote: "To capture MCP server activity with full call detail, enable the logs exporter and set OTEL_LOG_TOOL_DETAILS=1."
  accessed: 2026-11-19

- id: F27
  claim: "Compliance API Activity entries identify API-key actions as api_actor and include api_key_id, IP address, and user agent."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/compliance-activity-feed
  title: "Query the Activity Feed"
  source: anthropic-docs
  quote: "api_actor | A request called the Claude API or the Compliance API with a customer-issued API key. Compliance API calls produce this actor type for both Compliance Access Keys and Admin API keys. | api_key_id, ip_address, user_agent"
  accessed: 2026-11-19

- id: F26
  claim: "Compliance Activity Feed requests use GET /v1/compliance/activities with an x-api-key credential and anthropic-version header."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/compliance-api
  title: "Compliance API"
  source: anthropic-docs
  quote: >-
    "https://api.anthropic.com/v1/compliance/activities?limit=1" -H
    "x-api-key: $ANTHROPIC_COMPLIANCE_ACCESS_KEY" -H "anthropic-version:
    2026-10-21"
  accessed: 2026-11-19

- id: F28
  claim: "Admin API keys reach only the Compliance Activity Feed; the broader Compliance API uses Compliance Access Keys."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/compliance-api-access
  title: "Set up the Compliance API"
  source: anthropic-docs
  quote: "Organization admins create Admin API keys in Claude Console; these keys unlock the Activity Feed only."
  accessed: 2026-11-19

- id: F29
  claim: "Compliance API does not include Claude Code usage authenticated with a Claude Console API key or run through any cloud provider."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/compliance-integration-patterns
  title: "Design your compliance integration"
  source: anthropic-docs
  quote: "Claude Code usage authenticated with a Claude Console API key, run through any cloud platform, or run in a Claude Code cloud session."
  accessed: 2026-11-19

- id: F30
  claim: "Anthropic recommends storing API keys in a secrets manager, rotating periodically, and disabling or deleting suspected leaked keys."
  tag: REC
  url: https://platform.claude.com/docs/en/manage-claude/authentication
  title: "Authentication"
  source: anthropic-docs
  quote: "Store API keys in a secrets manager, rotate them periodically, and disable or delete any key you suspect has leaked."
  accessed: 2026-11-19

- id: F31
  claim: "Claude Compliance Access Key rotation can be performed without downtime by creating, deploying, verifying, then deleting the old key."
  tag: REC
  url: https://platform.claude.com/docs/en/manage-claude/compliance-api-access
  title: "Set up the Compliance API"
  source: anthropic-docs
  quote: "Verify the integration succeeds with the new key."
  accessed: 2026-11-19

- id: F33
  claim: "Claude Agent SDK allowedTools/disallowedTools entries add allow/deny rules, but allowed tools do not remove unlisted tools from Claude's available toolset."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/permissions
  title: "Configure permissions"
  source: claude-code-docs
  quote: "When you set allowedTools and disallowedTools (TypeScript) or allowed_tools and disallowed_tools (Python), Claude Code adds their entries to the allow and deny rule lists in the permission evaluation flow. Any other tool not listed in allowed_tools is still available to Claude, and a call to it that needs approval falls through to the permission mode."
  accessed: 2026-11-19

- id: F34
  claim: "The Compliance API does not include prompt text or model responses from Claude API workloads authenticated with an API key."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/compliance-integration-patterns
  title: "Design your compliance integration"
  source: anthropic-docs
  quote: "Prompt text or model responses from Claude Console, or from Claude API workloads authenticated with an API key."
  accessed: 2026-11-19

- id: F35
  claim: "Claude WIF's SDK begins an advisory token refresh at expiry minus 120 seconds."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
  title: "Workload Identity Federation"
  source: anthropic-docs
  quote: "The SDK caches the token and refreshes it on a two-tier schedule: Advisory refresh at expiry minus 120 seconds. The SDK attempts a new exchange."
  accessed: 2026-11-19

- id: F36
  claim: "The WIF token-exchange request uses grant_type urn:ietf:params:oauth:grant-type:jwt-bearer."
  tag: FACT
  url: https://platform.claude.com/docs/en/manage-claude/wif-reference
  title: "WIF reference"
  source: anthropic-docs
  quote: "grant_type | Yes | Always urn:ietf:params:oauth:grant-type:jwt-bearer."
  accessed: 2026-11-19


