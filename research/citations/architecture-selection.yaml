- id: "F1"
  claim: "Workflows follow predefined code paths."
  tag: "FACT"
  url: "https://www.anthropic.com/research/building-effective-agents"
  title: "Building effective agents"
  source: "anthropic-engineering"
  quote: "Workflows are systems where LLMs and tools are orchestrated through predefined code paths."
  accessed: "2026-11-19"
- id: "F2"
  claim: "Agents dynamically control their processes and tools."
  tag: "FACT"
  url: "https://www.anthropic.com/research/building-effective-agents"
  title: "Building effective agents"
  source: "anthropic-engineering"
  quote: "Agents, on the other hand, are systems where LLMs dynamically direct their own processes and tool usage, maintaining control over how they accomplish tasks."
  accessed: "2026-11-19"
- id: "F3"
  claim: "Start with the simplest solution, which may not be agentic."
  tag: "REC"
  url: "https://www.anthropic.com/research/building-effective-agents"
  title: "Building effective agents"
  source: "anthropic-engineering"
  quote: "When building applications with LLMs, we recommend finding the simplest solution possible, and only increasing complexity when needed. This might mean not building agentic systems at all."
  accessed: "2026-11-19"
- id: "F4"
  claim: "Agents often trade cost and latency for task performance."
  tag: "FACT"
  url: "https://www.anthropic.com/research/building-effective-agents"
  title: "Building effective agents"
  source: "anthropic-engineering"
  quote: "Agentic systems often trade latency and cost for better task performance, and you should consider when this tradeoff makes sense."
  accessed: "2026-11-19"
- id: "F5"
  claim: "Workflows suit well-defined tasks, agents flexible decisions."
  tag: "REC"
  url: "https://www.anthropic.com/research/building-effective-agents"
  title: "Building effective agents"
  source: "anthropic-engineering"
  quote: "When more complexity is warranted, workflows offer predictability and consistency for well-defined tasks, whereas agents are the better option when flexibility and model-driven decision-making are needed at scale."
  accessed: "2026-11-19"
- id: "F6"
  claim: "Framework abstractions may obscure prompts and responses."
  tag: "FACT"
  url: "https://www.anthropic.com/research/building-effective-agents"
  title: "Building effective agents"
  source: "anthropic-engineering"
  quote: "However, they often create extra layers of abstraction that can obscure the underlying prompts ​​and responses, making them harder to debug."
  accessed: "2026-11-19"
- id: "F7"
  claim: "Multi-agent suitability includes parallelism and context volume."
  tag: "REC"
  url: "https://www.anthropic.com/research/multi-agent-research-system"
  title: "How we built our multi-agent research system"
  source: "anthropic-engineering"
  quote: "We’ve found that multi-agent systems excel at valuable tasks that involve heavy parallelization, information that exceeds single context windows, and interfacing with numerous complex tools."
  accessed: "2026-11-19"
- id: "F8"
  claim: "The observed token multipliers were relative to chat."
  tag: "FACT"
  url: "https://www.anthropic.com/research/multi-agent-research-system"
  title: "How we built our multi-agent research system"
  source: "anthropic-engineering"
  quote: "In our data, agents typically use about 4× more tokens than chat interactions, and multi-agent systems use about 15× more tokens than chats."
  accessed: "2026-11-19"
- id: "F9"
  claim: "Shared-context or dependent work may not suit multi-agent."
  tag: "FACT"
  url: "https://www.anthropic.com/research/multi-agent-research-system"
  title: "How we built our multi-agent research system"
  source: "anthropic-engineering"
  quote: "Further, some domains that require all agents to share the same context or involve many dependencies between agents are not a good fit for multi-agent systems today."
  accessed: "2026-11-19"
- id: "F10"
  claim: "The Agent SDK runs Claude Code in a process the developer operates."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/agent-sdk/overview"
  title: "Agent SDK overview"
  source: "claude-code-docs"
  quote: "Embed Claude Code’s agent in your own Python or TypeScript application, in a process you operate"
  accessed: "2026-11-19"
- id: "F11"
  claim: "The tool runner handles loop, errors, and types; use a manual loop for specified control needs."
  tag: "REC"
  url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-runner"
  title: "Tool runner (SDK)"
  source: "anthropic-docs"
  quote: "The tool runner handles the agentic loop, error wrapping, and type safety so you don’t have to. When you need human-in-the-loop approval, custom logging, or conditional execution, use the manual loop instead."
  accessed: "2026-11-19"
- id: "F12"
  claim: "The runner manages conversation state by default."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-runner"
  title: "Tool runner (SDK)"
  source: "anthropic-docs"
  quote: "By default, the runner manages conversation state for you: after each tool-call turn, it appends the assistant message and any tool results to its own message history."
  accessed: "2026-11-19"
- id: "F13"
  claim: "Hosted Managed Agents provides an agent harness and infrastructure."
