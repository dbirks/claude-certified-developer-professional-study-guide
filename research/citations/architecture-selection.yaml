  title: "Claude Managed Agents overview"
  source: "anthropic-docs"
  quote: "Claude Managed Agents provides the harness and infrastructure for running Claude as an autonomous agent."
  accessed: "2026-11-19"
  version_note: "Managed Agents beta, documentation accessed 2026-11-19."
