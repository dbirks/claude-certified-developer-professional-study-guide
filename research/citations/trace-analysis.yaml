- id: F1
  claim: "Head sampling decides early without the complete trace."
  tag: FACT
  url: https://opentelemetry.io/docs/concepts/sampling/
  title: "Sampling"
  source: standard
  quote: "Head sampling is a sampling technique used to make a sampling decision as early as possible. A decision to sample or drop a span or trace is not made by inspecting the trace as a whole."
  accessed: 2026-11-19
- id: F2
  claim: "Head sampling alone cannot ensure capture of all traces containing errors."
  tag: FACT
  url: https://opentelemetry.io/docs/concepts/sampling/
  title: "Sampling"
  source: standard
  quote: "The primary downside to head sampling is that it is not possible to make a sampling decision based on data in the entire trace. For example, you cannot ensure that all traces with an error within them are sampled with head sampling alone."
  accessed: 2026-11-19
- id: F3
  claim: "Tail sampling considers all or most spans and can apply trace-wide criteria."
  tag: FACT
  url: https://opentelemetry.io/docs/concepts/sampling/
  title: "Sampling"
  source: standard
  quote: "Tail sampling is where the decision to sample a trace takes place by considering all or most of the spans within the trace."
  accessed: 2026-11-19
- id: F4
  claim: "Some pipelines combine head and tail sampling to protect the pipeline."
  tag: FACT
  url: https://opentelemetry.io/docs/concepts/sampling/
  title: "Sampling"
  source: standard
  quote: "Finally, for some systems, tail sampling might be used in conjunction with Head Sampling."
  accessed: 2026-11-19
- id: F5
  claim: "The collector needs trace-affine routing and holds spans in memory."
  tag: FACT
  url: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/tailsamplingprocessor/README.md
  title: "Tail Sampling Processor"
  source: standard
  quote: "The processor keeps spans in memory while it waits to make a sampling decision. All spans for a given trace must be sent to the same Collector instance."
  accessed: 2026-11-19
- id: F6
  claim: "The processor supports policy selection by status, latency and attributes."
  tag: FACT
  url: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/tailsamplingprocessor/README.md
  title: "Tail Sampling Processor"
  source: standard
  quote: "status_code: Sample based upon the status code (OK, ERROR or UNSET)"
  accessed: 2026-11-19
- id: F7
  claim: "Tail sampling uses a configurable decision wait."
  tag: FACT
  url: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/tailsamplingprocessor/README.md
  title: "Tail Sampling Processor"
  source: standard
  quote: "decision_wait (default = 30s): Time before timer handling for a trace."
  accessed: 2026-11-19
- id: F8
  claim: "Collector capacity pressure can discard traces before sampling."
  tag: FACT
  url: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/tailsamplingprocessor/README.md
  title: "Tail Sampling Processor"
  source: standard
  quote: "If the collector is processing more traces in-memory than the num_traces configuration option allows, some will have to be dropped before they can be sampled."
  accessed: 2026-11-19
- id: F9
  claim: "Late spans can lead to inconsistent decisions."
  tag: FACT
  url: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/tailsamplingprocessor/README.md
  title: "Tail Sampling Processor"
  source: standard
  quote: "Late spans can cause different sampling decisions for different parts of the trace."
  accessed: 2026-11-19
- id: F10
  claim: "Overflow can preserve totals while filtered or grouped metric queries undercount."
  tag: FACT
  url: https://opentelemetry.io/blog/2026/cardinality-limits-in-opentelemetry/
  title: "Metric cardinality limits in OpenTelemetry: a practical guide"
  source: standard
  quote: "That protection is useful, but it has a consequence many users do not expect: when a metric stream overflows, the total value remains correct, while queries that filter or group by attributes can undercount."
  accessed: 2026-11-19
- id: F11
  claim: "Metrics aggregate by the full attribute combination."
  tag: FACT
  url: https://opentelemetry.io/blog/2026/cardinality-limits-in-opentelemetry/
  title: "Metric cardinality limits in OpenTelemetry: a practical guide"
  source: standard
  quote: "The SDK aggregates measurements by the full set of attribute values. Each unique attribute combination becomes a separate data point that the SDK tracks in memory."
  accessed: 2026-11-19
