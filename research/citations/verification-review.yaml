- id: F24
  claim: "New verification gates roll out across off, observe, and enforce modes: observe mode logs what would have been blocked so teams can measure false positives before enabling enforce."
  tag: REC
  url: https://claude.dev/blog/how-the-claude-code-team-thinks-about-verification/
  title: "How the Claude Code team thinks about verification"
  source: anthropic-engineering
  quote: "We've also created a commit gate that can block a commit if the session did not contain /code-review or /verify. We've set it up with off, observe, and enforce modes. Observe mode will log what would have been blocked, so that we can review any false positives and ensure no one is impacted."
  accessed: 2026-11-19

- id: F25
  claim: "Anthropic calibrates AI reviewers against an eval set of past incidents and reverts (with expert-confirmed bug keys) plus clean merged PRs as a control for over-flagging, scoring recall separately at raw, post-verification, and final stages."
  tag: REC
  url: https://claude.dev/blog/how-the-claude-code-team-thinks-about-verification/
  title: "How the Claude Code team thinks about verification"
  source: anthropic-engineering
  quote: "They also evaluated the recall rate for raw findings, post-verification, and final review separately. This lets them see if the system is losing bugs it had already found. Any evaluation that treats all these as one end-to-end score won't capture this nuance."
  accessed: 2026-11-19

- id: F26
  claim: "Deploying Code Review internally raised PRs receiving substantive comments from 16% to 54%, with findings on 84% of PRs over 1,000 lines (avg 7.5) vs 31% under 50 lines (avg 0.5) and under 1% marked incorrect."
  tag: FACT
  url: https://claude.com/resources/articles/code-review
  title: "Bringing Code Review to Claude Code"
  source: anthropic-engineering
  quote: "We've been running Code Review internally for months: on large PRs (over 1,000 lines changed), 84% get findings, averaging 7.5 issues. On small PRs under 50 lines, that drops to 31%, averaging 0.5 issues. Engineers largely agree with what it surfaces: less than 1% of findings are marked incorrect."
  accessed: 2026-11-19

- id: F27
  claim: "False positives and nits are far costlier when the PR author is an agent—because agents fix every comment and trigger new review rounds (one CLI PR looped >50 rounds overnight)—so Anthropic tracks comment disposition and enforces convergence caps."
  tag: FACT
  url: https://claude.dev/blog/solving-code-review-at-anthropic/
  title: "How the Claude Code team does code review"
  source: anthropic-engineering
  quote: "Noise costs more when the author is an agent. A person can wave off a nit in seconds. An agent fixes it, which means another commit and another round of review. Review has to converge. An agent author and an agent reviewer can keep each other busy indefinitely."
  accessed: 2026-11-19

- id: F28
  claim: "Convergence controls (3-round cap, diff-only re-review after early passes, flagging bug classes, suppressing duplicates) raised first-round pass rate from 65% to 78% and cut 5+ round PRs from 8.9% to 1.5%."
  tag: FACT
  url: https://claude.dev/blog/solving-code-review-at-anthropic/
  title: "How the Claude Code team does code review"
  source: anthropic-engineering
  quote: "Pass after one review and fix round 65% 78% Need five or more rounds 8.9% 1.5% Mean reviews to pass 2.08 1.32"
  accessed: 2026-11-19

- id: F29
  claim: "Human oversight scales by risk tier (Low: 0 humans for trusted authors if automated review and security pass; Medium: 1 human; High/sensitive paths: 2 humans + CODEOWNERS), while bot approvals never replace required humans."
  tag: REC
  url: https://claude.dev/blog/solving-code-review-at-anthropic/
  title: "How the Claude Code team does code review"
  source: anthropic-engineering
  quote: "An agent's approval never counts as a person's, either. Automated review can clear a low-risk change, but it can't fill a slot that calls for a human."
  accessed: 2026-11-19

- id: F30
  claim: "Teams measure human oversight capacity via human approvals per PR (median and p95), human comments, and wait time, using revert rate and incident rate as guardrails."
  tag: REC
  url: https://claude.dev/blog/solving-code-review-at-anthropic/
  title: "How the Claude Code team does code review"
  source: anthropic-engineering
  quote: "To measure human time, we track human approvals per PR (median and 95th percentile), human comments, and how long a PR waits on a person. Revert and incident rates are the guardrail: if they rise, we haven't saved human time, we've only moved it."
  accessed: 2026-11-19

- id: F31
