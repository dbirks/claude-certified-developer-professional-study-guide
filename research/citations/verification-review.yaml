- id: F1
  claim: "Rapid AI code generation has made human code review the primary delivery bottleneck, with Anthropic engineers shipping 200% more code per engineer year-over-year."
  tag: FACT
  url: https://claude.com/resources/articles/code-review
  title: "Bringing Code Review to Claude Code"
  source: anthropic-engineering
  quote: "Code output per Anthropic engineer has grown 200% in the last year. Code review has become a bottleneck, and we hear the same from customers every week. They tell us developers are stretched thin, and many PRs get skims rather than deep reads."
  accessed: 2026-11-19

- id: F2
  claim: "At Anthropic, engineers ship 8x as much code per quarter as in 2021-2025 and Claude authors about 80% of merged code, creating an Amdahl's Law bottleneck unless reviews and monitoring scale too."
