  url: https://claude.com/resources/articles/how-anthropic-secures-its-ai-native-software-development-lifecycle
  title: "How Anthropic secures its AI-native software development lifecycle"
  source: anthropic-engineering
  quote: "Our software engineers on average ship 8x as much code per quarter as they did from 2021 to 2025. Our reviews, monitoring, and other security processes needed to scale alongside this increased pace. Otherwise it becomes a formula for bottlenecks (Amdahl’s Law)."
  accessed: 2026-11-19

