- id: F5
  claim: "Verification loops expand agent delegation capacity from one or two human-checked Claude sessions to dozens or hundreds running in parallel."
  tag: REC
  url: https://claude.dev/blog/how-the-claude-code-team-thinks-about-verification/
  title: "How the Claude Code team thinks about verification"
  source: anthropic-engineering
  quote: "Verification loops are the building block that lets you delegate more work to Claude. Without them, you can really only run one or two Claudes at a time, because you have to check everything yourself. With them, you can run dozens or hundreds in parallel."
  accessed: 2026-11-19

- id: F6
  claim: "Giving Claude a deterministic pass/fail check (tests, build exit code, linter, fixture diff, or browser screenshot) lets it self-correct, and asking for command output as evidence avoids false completion claims."
  tag: REC
  url: https://code.claude.com/docs/en/best-practices#give-claude-a-check-to-run
  title: "Best practices for Claude Code"
  source: claude-code-docs
  quote: "If you give it something that comes back pass or fail, Claude can close that loop itself. It makes the change, runs the check, and if something broke it reads the output and fixes it before running the check again."
  accessed: 2026-11-19

- id: F7
  claim: "A Stop hook enforces deterministic checks at turn end: exiting with code 2 blocks the stop and feeds stderr back to Claude until the check passes or the 8-consecutive-continuation cap (CLAUDE_CODE_STOP_HOOK_BLOCK_CAP) is reached."
  tag: FACT
  url: https://code.claude.com/docs/en/hooks#stop-input
  title: "Hooks reference"
  source: claude-code-docs
  quote: "Claude Code applies an 8-consecutive-continuation cap: after stop hooks have continued the turn eight times in a row, Claude Code overrides the next block and ends the turn. The count of consecutive continuations resets each time Claude calls a tool. To raise the cap, set CLAUDE_CODE_STOP_HOOK_BLOCK_CAP."
  accessed: 2026-11-19

- id: F8
  claim: "The /goal command wraps a session-scoped prompt-based Stop hook that invokes a separate small fast model after each turn to return Met, Not yet met, or Impossible based on conversation evidence."
  tag: FACT
  url: https://code.claude.com/docs/en/goal#how-evaluation-works
  title: "Keep Claude working toward a goal"
  source: claude-code-docs
  quote: "/goal is a wrapper around a session-scoped prompt-based Stop hook. Each time Claude finishes a turn, Claude Code sends the condition and the conversation so far to your configured small fast model. The model returns one of three verdicts, each with a short reason:"
  accessed: 2026-11-19

- id: F9
  claim: "The /verify skill builds and runs the application to observe real behavior rather than relying on tests or type checks alone, and project-level verify/simplify skills run automatically before commits on Claude Code v2.1.286+."
  tag: FACT
  url: https://code.claude.com/docs/en/commands#all-commands
  title: "Commands"
  source: claude-code-docs
  quote: "Confirm a code change does what it should by building your project's app, running it, and observing the result, rather than relying on tests or type checks."
  accessed: 2026-11-19

- id: F10
  claim: "End-to-end, property-based (fast-check, Hypothesis, proptest), and differential tests are harder for coding agents to fool than unit tests, and failing checks escalate to a human after three repair rounds."
  tag: REC
  url: https://claude.dev/blog/how-the-claude-code-team-thinks-about-verification/
  title: "How the Claude Code team thinks about verification"
  source: anthropic-engineering
  quote: "Claude runs the checks and tries to fix anything that fails. If a check is still failing after three rounds, Claude stops and brings in a human."
  accessed: 2026-11-19

- id: F11
  claim: "Internal testing on structured file generation showed that adding a separate rubric grader improved task success by up to 10 points over a standard prompting loop."
  tag: FACT
  url: https://claude.dev/blog/how-the-claude-code-team-thinks-about-verification/
  title: "How the Claude Code team thinks about verification"
  source: anthropic-engineering
  quote: "In internal testing around structured file generation, having a separate grader check Claude’s work against a rubric improved task success by up to 10 points over a standard prompting loop, with the largest gains on the hardest problems."
  accessed: 2026-11-19

- id: F12
  claim: "Managed Code Review (Team/Enterprise on GitHub) executes four stages on Anthropic infrastructure (Find in parallel, Verify to drop false positives, Rank by severity, Post inline comments and check run) with read-only repo access and without executing code."
  tag: FACT
  url: https://code.claude.com/docs/en/code-review#how-reviews-work
  title: "Code Review"
  source: claude-code-docs
  quote: "A review runs on Anthropic infrastructure in four stages: 1. Find: several agents examine the diff and the surrounding code in parallel. 2. Verify: a verification step checks the candidate findings against the code and filters out false positives. 3. Rank: the findings that remain are deduplicated and ranked by severity. 4. Post: the review posts its results on the pull request."
  accessed: 2026-11-19

- id: F13
  claim: "Managed Code Review categorizes findings as Important, Nit, or Pre-existing, and its Claude Code Review check run concludes neutral or skipped—never failure—leaving merge blocking to repository rules or scripts."
  tag: FACT
  url: https://code.claude.com/docs/en/code-review-pull-requests#check-run-output
  title: "Read and request reviews on a pull request"
  source: claude-code-docs
  quote: "The check run concludes as neutral, or as skipped after some pushes that change no files and keep the earlier result. It never concludes as a failure, so a finished review doesn't fail a required check."
  accessed: 2026-11-19

- id: F14
  claim: "Managed Code Review embeds a machine-readable severity JSON comment in the check run output.text so CI scripts can gate merges on normal (Important) findings while treating a missing line as no verdict."
  tag: FACT
  url: https://code.claude.com/docs/en/code-review-pull-requests#read-the-result-from-a-script
  title: "Read and request reviews on a pull request"
  source: claude-code-docs
  quote: "To gate a merge or post a summary from your own CI, parse the last line of the Details text with gh and jq. That line is an HTML comment that holds the severity counts as JSON:"
  accessed: 2026-11-19

- id: F15
  claim: "Code Review supports Quick, Standard, and Deep levels and three trigger cadences (Once after PR creation, After every push, Manual), skips automatic runs on drafts and forks, and bills ~$15-25 on average through usage credits with monthly spend caps."
  tag: FACT
  url: https://code.claude.com/docs/en/code-review-setup#set-when-reviews-run
  title: "Set up Code Review"
  source: claude-code-docs
  quote: "Each repository has its own Review runs setting, which decides when its pull requests get reviewed. Once after PR creation: a review runs when a pull request is opened, reopened, or marked ready for review After every push: a review runs on pushes to the pull request branch, catching new issues as the pull request evolves and auto-resolving threads when you fix flagged issues Manual (@claude review): opening or pushing to a pull request doesn't start a review."
  accessed: 2026-11-19

- id: F16
  claim: "Code Review reads REVIEW.md from the base or default branch—never from the pull request's own diff—and only honors severity downgrades, exclusions, and nit caps when branch protection is confirmed."
  tag: FACT
  url: https://code.claude.com/docs/en/code-review-customize#which-branch-review-md-is-read-from
  title: "Customize Code Review"
  source: claude-code-docs
  quote: "Code Review reads REVIEW.md from the pull request's base branch or from the default branch, never from the pull request's own changes. To change review behavior, merge the REVIEW.md change first."
  accessed: 2026-11-19

- id: F17
  claim: "Local /code-review (alias /review) runs in a fresh forked subagent context so it is unbiased by the author session, accepts effort levels (low through max) to trade false-positive filtering for coverage, and escalates via /code-review ultra to a cloud multi-agent sandbox."
  tag: FACT
  url: https://code.claude.com/docs/en/code-review-local#tune-effort-and-arguments
  title: "Review locally with /code-review"
  source: claude-code-docs
  quote: "Pass an effort level to trade coverage for confidence. At low, the review reports the findings it's most confident in, so you see fewer false positives. From medium through max, the review broadens coverage."
  accessed: 2026-11-19

- id: F18
  claim: "Ultrareview (/code-review ultra or claude ultrareview) runs a multi-agent fleet in a cloud sandbox where findings are independently reproduced and verified, taking 5-15 minutes with a default limit of 500 files and 8,000 changed lines."
  tag: FACT
  url: https://code.claude.com/docs/en/ultrareview#diff-limits-and-fallbacks
  title: "Find bugs with ultrareview"
  source: claude-code-docs
  quote: "Higher signal: every reported finding is independently reproduced and verified, so the results focus on real bugs rather than style suggestions Broader coverage: a larger fleet of reviewer agents explores the change in parallel, which surfaces issues that a local review can miss"
  accessed: 2026-11-19

- id: F19
  claim: "Claude Code GitHub Actions (anthropics/claude-code-action@v1) runs on GitHub runners in interactive mode (@claude trigger) or automation mode (prompt input), supports OIDC workload identity federation, enforces write-access and non-bot checks, and requires a distinct trigger_phrase if paired with Code Review."
  tag: FACT
  url: https://code.claude.com/docs/en/code-review-pull-requests#use-code-review-alongside-the-claude-code-github-action
  title: "Read and request reviews on a pull request"
  source: claude-code-docs
  quote: "If the repository also runs the Claude Code GitHub Action in interactive mode with its default @claude trigger phrase, an @claude review comment starts the Action as well. To keep the two apart, set the Action's trigger_phrase input to a different phrase."
  accessed: 2026-11-19

- id: F20
  claim: "When running against pull requests, claude-code-action restores .claude/, .mcp.json, .claude.json, CLAUDE.md, and related config paths from the base or default branch and requires avoiding checking out untrusted PR heads on pull_request_target or workflow_run."
  tag: FACT
  url: https://github.com/anthropics/claude-code-action/blob/main/docs/security.md
  title: "Claude Code Action Security"
  source: other
  quote: "When the action runs against a pull request, it restores a fixed list of Claude configuration paths from the PR base branch before starting Claude: .claude/, .mcp.json, .claude.json, .gitmodules, .ripgreprc, CLAUDE.md, CLAUDE.local.md, AGENTS.md, and .husky/."
  accessed: 2026-11-19

- id: F21
  claim: "The /security-review command and anthropics/claude-code-security-review GitHub Action run semantic diff-aware vulnerability analysis with automated false-positive filtering, and require maintainer approval for external fork PRs to mitigate prompt injection."
  tag: FACT
  url: https://github.com/anthropics/claude-code-security-review
  title: "Claude Code Security Reviewer"
  source: other
  quote: "This action is not hardened against prompt injection attacks and should only be used to review trusted PRs. We recommend configuring your repository to use the \"Require approval for all external contributors\" option to ensure workflows only run after a maintainer has reviewed the PR."
  accessed: 2026-11-19

- id: F22
  claim: "The security-guidance plugin layers three automatic in-session checks (deterministic per-edit pattern matching, end-of-turn background diff review, and agentic commit/push review with fresh context) before code reaches a PR."
  tag: FACT
  url: https://code.claude.com/docs/en/security-guidance#what-the-plugin-checks
  title: "Catch security issues as Claude writes code"
  source: claude-code-docs
  quote: "The plugin does not ask the same Claude instance that wrote the code to grade itself. The per-edit check is a deterministic string match with no model involved. The end-of-turn and commit reviews run as a separate Claude call with a fresh context and a security-focused prompt: the reviewer starts from the diff, has no investment in the original approach, and is instructed only to find problems."
  accessed: 2026-11-19

- id: F23
  claim: "Anthropic rolls out new AI reviewers in shadow mode (posting comments for human approval until trust is earned), red-teams them with malicious changes, and samples automated approvals."
  tag: REC
  url: https://claude.com/resources/articles/how-anthropic-secures-its-ai-native-software-development-lifecycle
  title: "How Anthropic secures its AI-native software development lifecycle"
