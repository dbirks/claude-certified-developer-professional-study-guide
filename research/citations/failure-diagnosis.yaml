- id: F27
  claim: "Retrying a refused request on the same model usually produces another refusal."
  tag: REC
  url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/handle-streaming-refusals
  title: "Handle streaming refusals"
  source: anthropic-docs
  quote: "Re-sending a refused request to the same model usually results in another refusal."
  accessed: 2026-11-19

- id: F28
  claim: "Long requests can fail when an intermediary network drops an idle connection."
  tag: REC
  url: https://platform.claude.com/docs/en/api/errors
  title: "Claude API errors"
  source: anthropic-docs
  quote: "Some networks might drop idle connections after a variable period of time, which can cause the request to fail or time out without receiving a response from Anthropic."
  accessed: 2026-11-19

- id: F29
  claim: "An HTTP 401 `authentication_error` points to an API key issue."
  tag: FACT
  url: https://platform.claude.com/docs/en/api/errors
  title: "Claude API errors"
  source: anthropic-docs
  quote: "There’s an issue with your API key (for example, it’s malformed, revoked, or expired; see Key expiration)."
  accessed: 2026-11-19

- id: F30
  claim: "Starting with API version `2026-10-21`, sending `temperature`, `top_p`, or `top_k` returns HTTP 400 on every model; do not use them as a reproducibility switch for that API version."
  tag: VER
  url: https://platform.claude.com/docs/en/build-with-claude/thinking
  title: "Thinking"
  source: anthropic-docs
  quote: "Starting with API version 2026-10-21, a request that includes temperature, top_p, or top_k at any value returns a 400 error on every model."
  accessed: 2026-11-19
  version_note: "Applies beginning with Messages API version 2026-10-21, current as of 2026-11-19."

- id: F31
  claim: "The Messages API currently documents seven stop_reason values: end_turn, max_tokens, stop_sequence, tool_use, pause_turn, refusal, and model_context_window_exceeded."
  tag: VER
  url: https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons
  title: "Stop reasons and fallback"
  source: anthropic-docs
  quote: "Every Messages API response includes a stop_reason field that tells you why Claude stopped generating."
  accessed: 2026-11-19

- id: F32
  claim: "An incomplete tool-use block in a max_tokens-truncated response requires retrying with a higher max_tokens value to obtain the full block."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons
  title: "Stop reasons and fallback"
  source: anthropic-docs
  quote: "If Claude’s response is cut off because it hit the max_tokens limit, and the truncated response contains an incomplete tool use block, you’ll need to retry the request with a higher max_tokens value to get the full tool use."
  accessed: 2026-11-19

- id: F33
  claim: "To continue a pause_turn, replay the assistant content unchanged, preserve the same tools, omit a following user message, and pass back a container ID when present."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons
  title: "Stop reasons and fallback"
  source: anthropic-docs
  quote: "Keep the earlier messages and add the response’s content unchanged as an assistant message, including any server_tool_use block that has no result block."
  accessed: 2026-11-19

- id: F34
  claim: "Anthropic recommends retrying a refused request on a fallback model because retrying on the same model usually produces another refusal."
  tag: REC
  url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/handle-streaming-refusals
  title: "Handle streaming refusals"
  source: anthropic-docs
  quote: "Re-sending a refused request to the same model usually results in another refusal. Instead of only resetting context, retry on a fallback model with server-side fallback, the SDK middleware, or a manual retry."
  accessed: 2026-11-19

- id: F35
  claim: "The API handles streaming classifier refusals with stop_reason refusal, input and copyright validation as 400 errors, and model-generated refusals as standard text responses."
  tag: FACT
  url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/handle-streaming-refusals
  title: "Handle streaming refusals"
  source: anthropic-docs
  quote: "Streaming classifier refusals | stop_reason: refusal | During streaming when content violates policies. API input and copyright validation | 400 error codes | When input fails validation checks. Model-generated refusals | Standard text responses | When the model itself refuses."
  accessed: 2026-11-19

- id: F36
  claim: "A streaming classifier refusal arrives as a successful HTTP 200 response with stop_reason refusal and structured stop_details."
  tag: FACT
  url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/handle-streaming-refusals
  title: "Handle streaming refusals"
  source: anthropic-docs
  quote: "A refusal arrives as a successful HTTP 200 response with stop_reason: \"refusal\", so monitoring built only on error rates won’t surface it."
  accessed: 2026-11-19

