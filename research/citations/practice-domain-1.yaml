- id: F1
  claim: "Writing large structured subagent outputs directly to an artifact store or filesystem and returning lightweight references to the coordinator avoids 'game of telephone' degradation and token copying overhead."
  tag: REC
  url: https://www.anthropic.com/research/multi-agent-research-system
  title: "How we built our multi-agent research system"
  source: anthropic-research
  quote: "Subagents call tools to store their work in external systems, then pass lightweight references back to the coordinator. This prevents information loss during multi-stage processing and reduces token overhead from copying large outputs through conversation history."
  accessed: 2026-11-19

- id: F2
  claim: "Work should be decomposed by context boundaries rather than problem type (planner/implementer/tester/reviewer), because splitting tightly coupled phases creates handoff loss and excessive coordination token burn."
  tag: REC
  url: https://claude.com/blog/building-multi-agent-systems-when-and-how-to-use-them
  title: "When to use multi-agent systems (and when not to) | Claude by Anthropic"
  source: anthropic-engineering
  quote: "The key insight is to adopt a context-centric view rather than a problem-centric view when decomposing work."
  accessed: 2026-11-19

- id: F3
  claim: "Verification subagents suffer from the 'early victory problem' (declaring pass after one or two checks) unless given explicit instructions to run full suites, edge cases, and negative tests."
  tag: REC
  url: https://claude.com/blog/building-multi-agent-systems-when-and-how-to-use-them
  title: "When to use multi-agent systems (and when not to) | Claude by Anthropic"
  source: anthropic-engineering
  quote: "The most significant failure mode for verification subagents is marking outputs as passing without thorough testing. The verifier runs one or two tests, observes them pass, and declares success."
  accessed: 2026-11-19

- id: F4
  claim: "AgentDefinition supports tools (allowlist) and disallowedTools (denylist including mcp__server, mcp__server__*, and mcp__* globs); setting CLAUDE_AGENT_SDK_DISABLE_BUILTIN_AGENTS=1 removes built-in subagents."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/subagents
  title: "Subagents in the SDK - Claude Code Docs"
  source: claude-code-docs
  quote: "Setting CLAUDE_AGENT_SDK_DISABLE_BUILTIN_AGENTS=1 removes that default, and such a call fails with subagent_type is required."
  accessed: 2026-11-19

- id: F5
  claim: "SDK subagent fan-out is bounded by CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH (default 3 layers), CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS (default 20), and maxBudgetUsd/max_budget_usd (stops background subagents and ends with error_max_budget_usd)."
  tag: VER
  url: https://code.claude.com/docs/en/agent-sdk/subagents
  title: "Subagents in the SDK - Claude Code Docs"
  source: claude-code-docs
  quote: "Enforces the cap in three ways: refuses to spawn more subagents, returning Budget limit reached, stops background subagents that are still running, and ends the query with the error_max_budget_usd result subtype."
  accessed: 2026-11-19
  version_note: "Requires TypeScript Agent SDK v0.3.219+ or Python Agent SDK v0.2.127+ (Claude Code v2.1.219+)."

- id: F6
  claim: "The Agent SDK evaluates tool permissions in six fixed steps: Hooks -> Deny rules -> Ask rules -> Permission mode -> Allow rules -> canUseTool callback; auto-approved tools skip canUseTool, so checks on auto-approved tools must live in PreToolUse hooks."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/permissions
  title: "Configure permissions - Claude Code Docs"
  source: claude-code-docs
  quote: "A tool call approved at any earlier step, by acceptEdits or bypassPermissions, or by an allow rule, skips your canUseTool callback, so permission checks you put there are silently bypassed for that tool."
  accessed: 2026-11-19

- id: F7
  claim: "A subagent inherits plan, acceptEdits, auto, or bypassPermissions from the main session (overriding its own permissionMode); under default or dontAsk, it uses its own permissionMode except bypassPermissions is never applied."
  tag: VER
  url: https://code.claude.com/docs/en/agent-sdk/permissions
  title: "Configure permissions - Claude Code Docs"
  source: claude-code-docs
  quote: "The subagent inherits plan, acceptEdits, auto, or bypassPermissions from the main session, and under a default- or dontAsk-mode main session it runs in the mode you set. Even then, Claude Code never applies a \"bypassPermissions\" value, and applies an \"auto\" value only when auto mode is available to that subagent."
  accessed: 2026-11-19
  version_note: "The bypassPermissions restriction on subagents requires Claude Code v2.1.267 or later."

- id: F8
  claim: "The canUseTool callback handles runtime tool approvals and AskUserQuestion prompts (returning allow with updatedInput or deny with message), pausing execution indefinitely; AskUserQuestion is unavailable in subagents spawned via the Agent tool."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/user-input
  title: "Handle approvals and user input - Claude Code Docs"
  source: claude-code-docs
  quote: "Claude requests user input in two situations: when it needs permission to use a tool (like deleting files or running commands), and when it has clarifying questions (via the AskUserQuestion tool). Both trigger your canUseTool callback, which pauses execution until you return a response."
  accessed: 2026-11-19

- id: F9
  claim: "PreToolUse hooks return permissionDecision (allow, deny, ask, or defer with precedence deny > defer > ask > allow), receive agent_id/agent_type inside subagents, and require onFailure: 'block' to fail closed on callback errors or timeouts."
  tag: VER
  url: https://code.claude.com/docs/en/agent-sdk/hooks
  title: "Intercept and control agent behavior with hooks - Claude Code Docs"
  source: claude-code-docs
  quote: "When multiple PreToolUse hooks return different decisions, deny takes priority over defer, which takes priority over ask, which takes priority over allow."
  accessed: 2026-11-19
  version_note: "onFailure: 'block' requires TypeScript Agent SDK v0.3.317+ or Python Agent SDK v0.2.177+."

- id: F10
  claim: "In non-interactive (-p) single-tool-call turns, a PreToolUse hook returning permissionDecision: 'defer' pauses the turn with stop_reason: 'tool_deferred' and deferred_tool_use so an external approval system can resume the session later without holding a process open."
  tag: FACT
  url: https://code.claude.com/docs/en/hooks
  title: "Hooks reference - Claude Code Docs"
  source: claude-code-docs
  quote: "The hook returns permissionDecision: \"defer\". The tool doesn’t execute. The turn ends with a result carrying stop_reason: \"tool_deferred\", and the pending tool call stays in the transcript."
  accessed: 2026-11-19

- id: F11
  claim: "Agent Teams (experimental, CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1) differ from subagents by allowing direct peer messaging via JSON mailboxes and a file-locked shared task list, enforced by TeammateIdle and TaskCompleted hooks, with no nested teams or /resume restoration for in-process teammates."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-teams
  title: "Orchestrate teams of Claude Code sessions - Claude Code Docs"
  source: claude-code-docs
  quote: "Subagents report results back to the main agent. In agent teams, teammates share a task list, claim work, and communicate directly with each other."
  accessed: 2026-11-19

- id: F12
  claim: "Agent SDK sessions persist only the conversation transcript, not filesystem state; file edits require file checkpointing."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/sessions
  title: "Work with sessions"
  source: claude-code-docs
  quote: "Sessions persist the conversation, not the filesystem. To snapshot and revert file changes the agent made, use file checkpointing."
  accessed: 2026-11-19

- id: F13
  claim: "A tool call that was still in flight when a Claude Code process crashed is not automatically re-executed upon session resume."
  tag: FACT
  url: https://code.claude.com/docs/en/sessions
  title: "Manage sessions"
  source: claude-code-docs
  quote: "Interrupted tool calls: a tool that was still running when the previous process ended, for example in a crash, doesn’t get rerun when you resume."
  accessed: 2026-11-19

- id: F14
  claim: "Raw JSONL session transcript entry formats are internal to Claude Code and may break across releases."
  tag: FACT
  url: https://code.claude.com/docs/en/sessions
  title: "Manage sessions"
  source: claude-code-docs
  quote: "The entry format is internal to Claude Code and changes between versions, so scripts that parse these files directly can break on any release."
  accessed: 2026-11-19

- id: F15
  claim: "Claude Code /rewind tracks files modified by file editing tools; files modified solely by Bash commands are not tracked or reverted."
  tag: FACT
  url: https://code.claude.com/docs/en/checkpointing
  title: "Checkpointing"
  source: claude-code-docs
  quote: "Once Claude has edited a file with its file editing tools in your conversation, /rewind undoes changes that Bash commands make to that file afterward. A file that only Bash commands changed isn’t tracked and stays as it is."
  accessed: 2026-11-19

- id: F16
  claim: "In the Agent SDK, rewind_files()/rewindFiles() restores tracked files on disk without rolling back the conversation history."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-sdk/file-checkpointing
  title: "Rewind file changes with checkpointing"
  source: claude-code-docs
  quote: "File rewinding restores files on disk to a previous state. It does not rewind the conversation itself. The conversation history and context remain intact after calling rewindFiles() (TypeScript) or rewind_files() (Python)."
  accessed: 2026-11-19

- id: F17
  claim: "Claude Managed Agents sessions persist conversation history, sandbox state, and outputs server-side until deleted, making hosted Managed Agents ineligible for Zero Data Retention or HIPAA."
  tag: VER
  url: https://platform.claude.com/docs/en/managed-agents/overview
  title: "Claude Managed Agents overview"
  source: anthropic-docs
  quote: "Claude Managed Agents is stateful by design: sessions are long-running, resume cleanly after pauses, and store conversation history, sandbox state, and outputs server-side. Because of this, Managed Agents is not currently eligible for Zero Data Retention or HIPAA Business Associate Agreement (BAA) coverage."
  accessed: 2026-11-19
  version_note: "Managed Agents beta (managed-agents-2026-04-01); self-hosted Managed Agents is the exception for ZDR."

- id: F18
  claim: "Anthropic provides at least 60 days' notice before retiring publicly released models on Anthropic-operated platforms, while partner platforms (Bedrock, Google-managed Vertex) set independent schedules."
  tag: VER
  url: https://platform.claude.com/docs/en/about-claude/model-deprecations
  title: "Model deprecations"
  source: anthropic-docs
  quote: "Anthropic notifies customers with active deployments for models with upcoming retirements, providing at least 60 days’ notice before model retirement for publicly released models."
  accessed: 2026-11-19
  version_note: "Applies to Anthropic-operated platforms; claude-sonnet-4-5-20250929 retires November 30, 2026 (replacement claude-sonnet-5-5)."

- id: F19
  claim: "Prompt caches are scoped per model, so switching models mid-session invalidates the prefix cache and triggers a full uncached history read on the next request."
  tag: FACT
  url: https://code.claude.com/docs/en/prompt-caching
  title: "How Claude Code uses prompt caching"
  source: claude-code-docs
  quote: "Each model has its own cache. Switching with /model means the next request reads the entire conversation history with no cache hits, even though the content is identical."
  accessed: 2026-11-19

- id: F20
  claim: "Models with preserved thinking (Fable 5.2, Mythos 5.2, Fable 5.1, Mythos 5.1, Opus 5.5, Sonnet 5.5, Haiku 5.5) reject thinking.type='enabled' with a 400 error and require 'adaptive'."
  tag: VER
  url: https://platform.claude.com/docs/en/build-with-claude/preserved-thinking
  title: "Preserved thinking"
  source: anthropic-docs
  quote: "Models with preserved thinking reject thinking: {\"type\": \"enabled\"} with a 400 error. When you move a conversation to one of them from a model whose requests set \"enabled\", send \"adaptive\" instead."
  accessed: 2026-11-19
  version_note: "Preserved thinking models as of Nov 2026: Fable 5.1/5.2, Mythos 5.1/5.2, Opus 5.5, Sonnet 5.5, Haiku 5.5."

- id: F21
  claim: "Preserved thinking blocks cryptographically bind to system, tools, and prior messages; altering any prefix before a block triggers a prefix-check failure (400 error) unless prefix_mismatch_behavior='drop_block' is set with the thinking-binding-controls-2026-08-01 beta header."
  tag: VER
  url: https://platform.claude.com/docs/en/build-with-claude/preserved-thinking/fix-bound-to-a-different-conversation
  title: "Fix a thinking block bound to a different conversation"
  source: anthropic-docs
  quote: "Set thinking.block_binding.prefix_mismatch_behavior to \"drop_block\", and send the beta header anthropic-beta: thinking-binding-controls-2026-08-01. Do this on every later request in the conversation, because the API doesn’t store the setting between requests."
  accessed: 2026-11-19
  version_note: "Requires beta header thinking-binding-controls-2026-08-01; also note account-bound thinking drops across unlinked accounts on Fable 5.2, Mythos 5.2, Sonnet 5.5, and Haiku 5.5."

- id: F22
  claim: "When deploying updated system prompts or tool schemas, keep running conversations on the system and tools of their last successful request to avoid invalidating preserved thinking."
  tag: REC
  url: https://platform.claude.com/docs/en/build-with-claude/preserved-thinking/change-tools-or-instructions
  title: "Change tools or instructions without failing the prefix check"
  source: anthropic-docs
  quote: "Keep sending each running conversation the system and tools of its last successful request, because its newest thinking was produced after that version. Going back to an earlier version would make that thinking invalid."
  accessed: 2026-11-19

