  title: "Prompt caching"
  source: anthropic-docs
  quote: "The input_tokens field represents only the tokens that come after the last cache breakpoint in your request, not all the input tokens you sent."
  accessed: 2026-11-19

- id: F24
  claim: "When 5-minute and 1-hour cache TTLs are used, cache_creation_input_tokens equals the sum of cache_creation.ephemeral_5m_input_tokens and ephemeral_1h_input_tokens."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  title: "Prompt caching"
  source: anthropic-docs
  quote: "The cache_creation_input_tokens field equals the sum of the values in the cache_creation object."
  accessed: 2026-11-19

- id: F25
  claim: "Cache diagnostics stores lightweight hash-and-token-estimate fingerprints keyed by response id to diagnose prefix divergence without storing raw prompt text."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/cache-diagnostics
  title: "Cache diagnostics"
  source: anthropic-docs
  quote: "For each request that includes the diagnostics object, the API stores a lightweight fingerprint keyed by the response id. It stores nothing for requests that omit the object."
  accessed: 2026-11-19

- id: F26
  claim: "Combining diagnostics with usage.cache_read_input_tokens separates prefix mutations from cache TTL expiry or prompts below the minimum cacheable length."
  tag: FACT
