  title: "Cache diagnostics"
  source: anthropic-docs
  quote: "diagnostics tells you whether your request changed, and usage.cache_read_input_tokens tells you whether the cache hit. Combining them tells you where to look."
  accessed: 2026-11-19

- id: F27
