- id: F16
  claim: "The TaskCompleted hook runs when a task is marked completed and can enforce completion criteria such as passing tests."
  tag: FACT
  url: https://code.claude.com/docs/en/hooks#taskcompleted
  title: "Hooks reference - Claude Code Docs"
  source: claude-code-docs
  quote: "Runs when a task is being marked as completed. This fires in two situations: when any agent explicitly marks a task as completed through the TaskUpdate tool, or when an agent team teammate finishes its turn with in-progress tasks. Use this to enforce completion criteria like passing tests or lint checks before a task can close."
  accessed: 2026-11-19

- id: F17
  claim: "A dynamic workflow rejects a parallel() or pipeline() call with more than 4,096 items."
  tag: FACT
  url: https://code.claude.com/docs/en/workflows#behavior-and-limits
  title: "Orchestrate dynamic workflows - Claude Code Docs"
  source: claude-code-docs
