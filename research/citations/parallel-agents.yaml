- id: F1
  claim: "Claude Code offers five parallel execution models—subagents, agent view, agent teams, projects, and dynamic workflows—supported by worktrees, cross-session messaging, and /batch."
  tag: FACT
  url: https://code.claude.com/docs/en/agents
  title: "Run agents in parallel - Claude Code Docs"
  source: claude-code-docs
  quote: "Claude Code has five ways to work on several tasks at once: subagents, agent view, agent teams, dynamic workflows, and projects. They differ in how involved you stay, from steering each conversation yourself to letting Claude coordinate a group of workers, and in whether the work runs on your machine or in the cloud."
  accessed: 2026-11-19

- id: F2
  claim: "Parallel sessions using claude --worktree give each terminal its own git worktree and branch from an existing commit so concurrent edits do not collide."
  tag: FACT
  url: https://code.claude.com/docs/en/common-workflows#run-parallel-sessions-with-worktrees
  title: "Common workflows - Claude Code Docs"
  source: claude-code-docs
  quote: "Work on a feature in one terminal while Claude fixes a bug in another, without the edits colliding. Each git worktree is a separate checkout on its own branch, created from an existing commit, so the repository needs at least one commit first."
  accessed: 2026-11-19

- id: F3
  claim: "Passing --worktree or -w creates a worktree under .claude/worktrees/<name>/ on branch worktree-<name> (auto-named if omitted), and non-interactive -p runs skip the interactive workspace trust check."
  tag: FACT
  url: https://code.claude.com/docs/en/worktrees#start-claude-in-a-worktree
  title: "Run parallel sessions with worktrees - Claude Code Docs"
  source: claude-code-docs
  quote: "Pass --worktree or -w with a name to create an isolated worktree and start Claude in it. By default, the worktree is created under .claude/worktrees/<name>/ at your repository root, on a new branch named worktree-<name>:"
  accessed: 2026-11-19

- id: F4
  claim: "New worktrees branch from the remote default branch when worktree.baseRef is 'fresh' (default) or local HEAD when set to 'head', and --worktree can fetch a PR or MR head by #<number> or URL."
  tag: FACT
  url: https://code.claude.com/docs/en/worktrees#choose-the-base-branch
  title: "Run parallel sessions with worktrees - Claude Code Docs"
  source: claude-code-docs
  quote: "Set worktree.baseRef in settings to branch from your current work instead. The setting accepts two values:"
  accessed: 2026-11-19

- id: F5
  claim: "Adding a .worktreeinclude file uses .gitignore syntax to copy gitignored files such as .env into new worktrees without duplicating tracked files."
  tag: FACT
  url: https://code.claude.com/docs/en/worktrees#copy-gitignored-files-into-worktrees
  title: "Run parallel sessions with worktrees - Claude Code Docs"
  source: claude-code-docs
  quote: "A worktree is a fresh checkout, so untracked files like .env or .env.local from your main repository are not present. To copy them automatically when Claude creates a worktree, add a .worktreeinclude file to your project root."
  accessed: 2026-11-19

- id: F6
  claim: "Claude Code enforces four worktree isolation checks (file edits, command working directory, git redirects, and command shape), though non-git shell file writes such as cp or redirects are governed by permissions and sandboxing rather than these checks."
  tag: FACT
  url: https://code.claude.com/docs/en/worktrees#how-claude-code-enforces-isolation
  title: "Run parallel sessions with worktrees - Claude Code Docs"
  source: claude-code-docs
  quote: "These checks read the path an edit targets, the directory a command runs in, and the text of the command. None of them tracks which files a shell command writes, so a command that writes into the main checkout without running git there, such as cp or a shell redirect, isn't refused by them."
  accessed: 2026-11-19

- id: F7
  claim: "Worktrees share the main checkout's .git directory, project plugins, .claude/settings.local.json permission approvals, and fallback untracked .claude/skills, agents, and commands."
  tag: FACT
  url: https://code.claude.com/docs/en/worktrees#what-worktrees-share-with-the-main-checkout
  title: "Run parallel sessions with worktrees - Claude Code Docs"
  source: claude-code-docs
  quote: "A worktree gets its own files and branch, but it shares the following with the main checkout:"
  accessed: 2026-11-19

- id: F8
  claim: "Non-interactive -p --worktree runs skip the exit cleanup prompt, leaving worktrees and git locks on disk until unlocked and removed manually or swept by a later session."
  tag: FACT
  url: https://code.claude.com/docs/en/worktrees#clean-up-worktrees
  title: "Run parallel sessions with worktrees - Claude Code Docs"
  source: claude-code-docs
  quote: "Non-interactive runs with -p have no exit prompt, so Claude doesn't clean up their worktrees, and Claude Code leaves the lock it took on each one at creation in place until a later session's stale-lock sweep releases it. To remove one, run git worktree remove; if git refuses because the worktree is locked, run git worktree unlock on it first."
  accessed: 2026-11-19

- id: F9
  claim: "Custom subagents with isolation: worktree (or Agent calls passing isolation: 'worktree') receive temporary worktrees removed automatically when clean and retained on disk if changes remain."
  tag: FACT
  url: https://code.claude.com/docs/en/worktrees#isolate-subagents-with-worktrees
  title: "Run parallel sessions with worktrees - Claude Code Docs"
  source: claude-code-docs
  quote: "Each subagent gets a temporary worktree that Claude Code removes automatically when the subagent finishes without changes; a worktree with changes stays on disk until the periodic sweep below can remove it without losing work."
  accessed: 2026-11-19

- id: F10
  claim: "Background sessions move into an isolated worktree under .claude/worktrees/ before editing files."
  tag: FACT
  url: https://code.claude.com/docs/en/agent-view#how-file-edits-are-isolated
  title: "Manage multiple agents with agent view - Claude Code Docs"
  source: claude-code-docs
  quote: "Before editing files, Claude moves the session into an isolated git worktree under .claude/worktrees/, so parallel sessions can read the same checkout but each writes to its own."
  accessed: 2026-11-19

- id: F11
  claim: "The bundled /batch skill decomposes a codebase-wide change into 5 to 30 independent units, asks for plan approval, and spawns one worktree-isolated background subagent per unit to implement, test, and open a PR."
  tag: FACT
  url: https://code.claude.com/docs/en/commands
  title: "Commands - Claude Code Docs"
  source: claude-code-docs
  quote: "Orchestrate large-scale changes across a codebase in parallel. Researches the codebase, decomposes the work into 5 to 30 independent units, and presents a plan. Once approved, spawns one background subagent per unit in an isolated worktree."
  accessed: 2026-11-19

- id: F12
  claim: "Agent teams do not automatically isolate teammates in git worktrees, so parallel file-editing work in an agent team must be partitioned by file ownership or moved to isolated worktree sessions."
  tag: REC
  url: https://code.claude.com/docs/en/agents#choose-an-approach
  title: "Run agents in parallel - Claude Code Docs"
  source: claude-code-docs
  quote: "Isolate the work with worktrees. Subagents and sessions you run yourself can each use a separate worktree. Agent teams don't isolate teammates in worktrees, so partition the work so each teammate owns a different set of files."
  accessed: 2026-11-19

- id: F13
  claim: "Agent teams are experimental, disabled by default (CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1), require an interactive session (ignored in -p/SDK), and coordinate via a file-locked shared task list and per-agent JSON mailboxes."
  tag: VER
  url: https://code.claude.com/docs/en/agent-teams
  title: "Orchestrate teams of Claude Code sessions - Claude Code Docs"
  source: claude-code-docs
  quote: "Spawning teammates also requires an interactive session. In non-interactive mode with the -p flag, including Agent SDK sessions, Claude doesn't spawn teammates, and a subagent that Claude names runs as an ordinary subagent even with agent teams enabled."
  accessed: 2026-11-19
  version_note: "Experimental feature flagged by CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1."

- id: F14
  claim: "Anthropic recommends starting agent teams with 3-5 teammates and 5-6 self-contained tasks per teammate, partitioning file ownership, and avoiding teams for sequential or same-file work."
  tag: REC
  url: https://code.claude.com/docs/en/agent-teams#best-practices
  title: "Orchestrate teams of Claude Code sessions - Claude Code Docs"
  source: claude-code-docs
  quote: "Start with 3-5 teammates for most workflows. This balances parallel work with manageable coordination. If you have 15 independent tasks, 3 teammates is a good starting point."
  accessed: 2026-11-19

