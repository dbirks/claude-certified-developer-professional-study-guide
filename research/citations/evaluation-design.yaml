- id: F1
  claim: "An agent evaluation defines a task as a test with inputs and success criteria, a trial as one execution attempt, and a grader as scoring logic containing assertions."
  tag: FACT
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "A task (a.k.a problem or test case) is a single test with defined inputs and success criteria. Each attempt at a task is a trial. Because model outputs vary between runs, we run multiple trials to produce more consistent results. A grader is logic that scores some aspect of the agent’s performance. A task can have multiple graders, each containing multiple assertions (sometimes called checks)."
  accessed: 2026-11-19

- id: F2
  claim: "A transcript (or trace/trajectory) records every API interaction and intermediate step, whereas the outcome is the final state persisted in the environment."
  tag: FACT
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "A transcript (also called a trace or trajectory) is the complete record of a trial, including outputs, tool calls, reasoning, intermediate results, and any other interactions. For the Anthropic API, this is the full messages array at the end of an eval run - containing all the calls to the API and all of the returned responses during the evaluation. The outcome is the final state in the environment at the end of the trial."
  accessed: 2026-11-19

- id: F3
  claim: "Evaluating an agent always evaluates the agent harness and the underlying model working together."
  tag: FACT
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "An evaluation harness is the infrastructure that runs evals end-to-end. It provides instructions and tools, runs tasks concurrently, records all the steps, grades outputs, and aggregates results. An agent harness (or scaffold) is the system that enables a model to act as an agent: it processes inputs, orchestrates tool calls, and returns results. When we evaluate “an agent,” we’re evaluating the harness and the model working together."
  accessed: 2026-11-19

- id: F4
  claim: "Agent evaluations combine code-based, model-based, and human graders, aggregated via weighted, binary, or hybrid task scoring."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "Agent evaluations typically combine three types of graders: code-based, model-based, and human. Each grader evaluates some portion of either the transcript or the outcome. An essential component of effective evaluation design is to choose the right graders for the job."
  accessed: 2026-11-19

- id: F5
  claim: "Capability evals start at a low pass rate to measure headroom, whereas regression evals target a nearly 100% pass rate and graduate from mastered capability tasks."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "Regression evals ask, “Does the agent still handle all the tasks it used to?” and should have a nearly 100% pass rate. They protect against backsliding, as a decline in score signals that something is broken and needs to be improved."
  accessed: 2026-11-19

- id: F6
  claim: "Once capability evals reach high pass rates, they can graduate into a continuous regression suite."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "After an agent is launched and optimized, capability evals with high pass rates can “graduate” to become a regression suite that is run continuously to catch any drift. Tasks that once measured “Can we do this at all?” then measure “Can we still do this reliably?”"
  accessed: 2026-11-19

- id: F7
  claim: "pass@k measures the probability of at least one success in k trials (rising with k), while pass^k measures the probability that all k trials succeed (falling exponentially with k)."
  tag: FACT
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "pass^k measures the probability that all k trials succeed. As k increases, pass^k falls since demanding consistency across more trials is a harder bar to clear. If your agent has a 75% per-trial success rate and you run 3 trials, the probability of passing all three is (0.75)³ ≈ 42%. This metric especially matters for customer-facing agents where users expect reliable behavior every time."
  accessed: 2026-11-19

- id: F8
  claim: "pass@k and pass^k diverge as k grows, making pass@k suited to tools where one valid solution suffices and pass^k suited to agents requiring consistent reliability."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "pass@k and pass^k diverge as trials increase. At k=1, they're identical (both equal the per-trial success rate). By k=10, they tell opposite stories: pass@k approaches 100% while pass^k falls to 0%. Both metrics are useful, and which to use depends on product requirements: pass@k for tools where one success matters, pass^k for agents where consistency is essential."
  accessed: 2026-11-19

- id: F9
  claim: "Starting an eval suite requires only 20 to 50 tasks drawn from real failures and manual checks, rather than hundreds of tasks upfront."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "We see teams delay building evals because they think they need hundreds of tasks. In reality, 20-50 simple tasks drawn from real failures is a great start. After all, in early agent development, each change to the system often has a clear, noticeable impact, and this large effect size means small sample sizes suffice."
  accessed: 2026-11-19

- id: F10
  claim: "A 0% pass@100 rate on frontier models usually indicates an ambiguous task specification or broken grader; a reference solution verifies solvability."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "With frontier models, a 0% pass rate across many trials (i.e. 0% pass@100) is most often a signal of a broken task, not an incapable agent, and a sign to double-check your task specification and graders. For each task, it’s useful to create a reference solution: a known working output that passes all graders. This proves that the task is solvable and verifies graders are correctly configured."
  accessed: 2026-11-19

- id: F11
  claim: "Eval datasets must be balanced with both positive triggers and negative non-trigger cases to prevent one-sided over- or under-triggering."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "Test both the cases where a behavior should occur and where it shouldn't. One-sided evals create one-sided optimization. For instance, if you only test whether the agent searches when it should, you might end up with an agent that searches for almost everything. Try to avoid class-imbalanced evals."
  accessed: 2026-11-19

- id: F12
  claim: "Each eval trial must run in an isolated, clean environment so shared state cannot cause correlated failures or leak solutions from prior trials."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "Each trial should be “isolated” by starting from a clean environment. Unnecessary shared state between runs (leftover files, cached data, resource exhaustion) can cause correlated failures due to infrastructure flakiness rather than agent performance. Shared state can also artificially inflate performance. For example, in some internal evals we observed Claude gaining an unfair advantage on some tasks by examining the git history from previous trials."
  accessed: 2026-11-19

- id: F13
  claim: "Grading rigid tool-call sequences creates brittle tests; Anthropic recommends grading what the agent produced and awarding partial credit for multi-component tasks."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "There is a common instinct to check that agents followed very specific steps like a sequence of tool calls in the right order. We’ve found this approach too rigid and results in overly brittle tests, as agents regularly find valid approaches that eval designers didn’t anticipate. So as not to unnecessarily punish creativity, it’s often better to grade what the agent produced, not the path it took."
  accessed: 2026-11-19

- id: F14
  claim: "Reading transcripts is essential to confirm whether failures reflect agent mistakes or broken graders, and to diagnose eval saturation when scores plateau near ceiling."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "An eval at 100% tracks regressions but provides no signal for improvement. Eval saturation occurs when an agent passes all of the solvable tasks, leaving no room for improvement."
  accessed: 2026-11-19

- id: F15
  claim: "Research and RAG agent evals should combine groundedness checks, coverage checks, and source quality checks, with LLM judges frequently calibrated against expert human judgment."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "Groundedness checks verify that claims are supported by retrieved sources, coverage checks define key facts a good answer must include, and source quality checks confirm the consulted sources are authoritative, rather than simply the first retrieved."
  accessed: 2026-11-19

- id: F16
  claim: "Eval-driven development accelerates model upgrades by turning ambiguous requirements into concrete tasks and revealing immediately how a new model performs."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "We recommend practicing eval-driven development: build evals to define planned capabilities before agents can fulfill them, then iterate until the agent performs well. Internally, we often build features that work “well enough” today but are bets on what models can do in a few months. Capability evals that start at a low pass rate make this visible. When a new model drops, running the suite quickly reveals which bets paid off."
  accessed: 2026-11-19

- id: F17
  claim: "Like the Swiss Cheese Model, teams should combine automated evals in CI/CD with production monitoring, A/B testing, user feedback, manual transcript review, and systematic human studies."
  tag: REC
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "Automated evals are especially useful pre-launch and in CI/CD, running on each agent change and model upgrade as the first line of defense against quality problems. Production monitoring kicks in post-launch to detect distribution drift and unanticipated real-world failures. A/B testing validates significant changes once you have sufficient traffic."
  accessed: 2026-11-19

- id: F18
  claim: "Success criteria should be specific, measurable, achievable, and relevant, using quantitative metrics or well-defined qualitative scales across multiple dimensions."
  tag: REC
  url: https://platform.claude.com/docs/en/test-and-evaluate/develop-tests
  title: "Define success criteria and build evaluations"
  source: anthropic-docs
  quote: "Measurable: Use quantitative metrics or well-defined qualitative scales. Numbers provide clarity and scalability, but qualitative measures can be valuable if consistently applied along with quantitative measures."
  accessed: 2026-11-19

- id: F19
  claim: "Evaluation design should mirror real-world task distributions with edge cases, automate grading where possible, and favor higher question volume with automated grading over small human-graded sets."
  tag: REC
  url: https://platform.claude.com/docs/en/test-and-evaluate/develop-tests
  title: "Define success criteria and build evaluations"
  source: anthropic-docs
  quote: "Prioritize volume over quality: More questions with slightly lower signal automated grading is better than fewer questions with high-quality human hand-graded evals."
  accessed: 2026-11-19

- id: F20
  claim: "LLM-based graders perform better when given clear rubrics, empirical output formats such as binary labels or 1-5 scales, and thinking enabled to reason before scoring."
  tag: REC
  url: https://platform.claude.com/docs/en/test-and-evaluate/develop-tests
  title: "Define success criteria and build evaluations"
  source: anthropic-docs
  quote: "Encourage reasoning: Use a grader model with thinking on, so that it reasons before it produces an evaluation score. This increases evaluation performance, particularly for tasks requiring complex judgment."
  accessed: 2026-11-19

