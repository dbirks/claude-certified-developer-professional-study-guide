- id: F22
  claim: "claude plugin eval runs each case three times by default in isolated non-interactive sessions and compares scores against a no-plugin baseline arm to measure delta."
  tag: FACT
  url: https://code.claude.com/docs/en/plugin-evals
  title: "Test plugins with evals"
  source: claude-code-docs
  quote: "One run of a non-deterministic agent tells you little, so each case runs three times by default. A run's score is the fraction of its graders that passed, weighted if you set weights, and the case's score is the mean across its runs. A case passes when its score meets the --threshold, 1.0 by default."
  accessed: 2026-11-19

- id: F23
  claim: "claude plugin eval excludes plugin-specific checks like tool_used: Skill from both arms' scores (scored: false) so the no-plugin baseline is not artificially pushed to zero."
  tag: FACT
  url: https://code.claude.com/docs/en/plugin-evals
  title: "Test plugins with evals"
  source: claude-code-docs
  quote: "A check like \"the skill was invoked\" can never pass without the plugin, so counting it would push the without-arm toward zero and inflate Δ. To keep the two arms comparable, Claude Code excludes such graders from the score in both arms and reports them in the with-arm as pass/fail indicators only."
  accessed: 2026-11-19

- id: F24
  claim: "claude plugin eval supports deterministic checks (regex, tool_used, tool_order, file_exists) and model-judged checks (llm requiring 2 of 3 judge votes, and baseline)."
  tag: FACT
  url: https://code.claude.com/docs/en/plugin-evals
  title: "Test plugins with evals"
  source: claude-code-docs
  quote: "Of the six types, regex, tool_used, tool_order, and file_exists are computed from the transcript and files and cost nothing, while llm and baseline call a judge model and add to the run's cost. There are no custom-code graders."
  accessed: 2026-11-19

- id: F25
  claim: "In CI pipelines, claude plugin eval should pin --model and --judge-model, pass --trust-plugin, emit --json, set --max-cost-usd, and gate on exit codes 0, 1, or 2."
  tag: REC
  url: https://code.claude.com/docs/en/plugin-evals
  title: "Test plugins with evals"
  source: claude-code-docs
  quote: "In your CI job, run the suite with --json to write the result for archiving, and fail the build on the exit code. Pass --trust-plugin so the job never waits at the first-run trust prompt, pin both models so scores are comparable over time, keep the report local, and set a cost ceiling as an upper limit:"
  accessed: 2026-11-19

- id: F26
  claim: "skill-creator stores cases in evals/evals.json, runs isolated subagents for with/without benchmarks, supports blind A/B comparisons, and tunes skill descriptions using should-trigger and should-not-trigger prompts."
  tag: FACT
  url: https://code.claude.com/docs/en/skills
  title: "Extend Claude with skills"
  source: claude-code-docs
  quote: "Description tuning: generates should-trigger and should-not-trigger prompts, measures the hit rate, and proposes description edits when the skill activates on the wrong requests"
  accessed: 2026-11-19

