- id: F58
  claim: "BM25 contributes lexical exact-match retrieval for precise words, phrases, identifiers, and technical terms."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "BM25 (Best Matching 25) is a ranking function that uses lexical matching to find precise word or phrase matches. It's particularly effective for queries that include unique identifiers or technical terms."
  accessed: 2026-11-19

- id: F59
  claim: "Contextual Retrieval adds chunk-specific explanatory context before embedding and BM25 indexing."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "Contextual Retrieval solves this problem by prepending chunk-specific explanatory context to each chunk before embedding (“Contextual Embeddings”) and creating the BM25 index (“Contextual BM25”)."
  accessed: 2026-11-19

- id: F60
  claim: "Anthropic describes merging lexical and semantic candidates by deduplicating results with rank fusion."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "Combine and deduplicate results from (3) and (4) using rank fusion techniques;"
  accessed: 2026-11-19

- id: F61
  claim: "Anthropic reported a 67% top-20 retrieval failure reduction when contextual embeddings and contextual BM25 were combined with reranking in its test setup."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "Specifically, we found that Reranked Contextual Embedding and Contextual BM25 reduced the top-20-chunk retrieval failure rate by 67% (5.7% → 1.9%)."
  accessed: 2026-11-19

- id: F62
  claim: "Anthropic defines 1 minus recall@20 as the percentage of relevant documents not retrieved within the top 20 chunks."
  tag: FACT
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "We use 1 minus recall@20 as our evaluation metric, which measures the percentage of relevant documents that fail to be retrieved within the top 20 chunks."
  accessed: 2026-11-19

- id: F63
  claim: "Anthropic recommends explicitly allowing Claude to admit uncertainty."
  tag: REC
  url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations
  title: "Reduce hallucinations"
  source: anthropic-docs
  quote: "Allow Claude to say “I don’t know”: Explicitly give Claude permission to admit uncertainty."
  accessed: 2026-11-19

- id: F64
  claim: "Anthropic says an entire knowledge base below about 200,000 tokens can sometimes be supplied directly instead of using RAG."
  tag: REC
  url: https://www.anthropic.com/research/contextual-retrieval
  title: "Contextual retrieval in AI systems"
  source: anthropic-research
  quote: "If your knowledge base is smaller than 200,000 tokens (about 500 pages of material), you can just include the entire knowledge base in the prompt that you give the model, with no need for RAG or similar methods."
  accessed: 2026-11-19

- id: F65
  claim: "Citations and strict structured outputs cannot be combined in a Messages API request."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/citations
  title: "Citations"
  source: anthropic-docs
  quote: "Citations cannot be used together with structured outputs. If you enable citations on any user-provided document (document blocks or search_result blocks) and also include the output_config.format parameter (or the deprecated output_format parameter), the API returns a 400 error."
  accessed: 2026-11-19

- id: F66
  claim: "Messages API citations are enabled per document block, and all documents in one request must consistently enable or disable citations."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/citations
  title: "Citations"
  source: anthropic-docs
  quote: "A request can’t mix documents that have citations enabled with documents that don’t."
  accessed: 2026-11-19

- id: F67
  claim: "Search result citations are disabled by default and all search results in a request must use the same setting."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/search-results
  title: "Search results"
  source: anthropic-docs
  quote: 'Citations are disabled by default; every example on this page sets "enabled": true explicitly. All search results in a request must use the same setting (see Citation control)'
  accessed: 2026-11-19

- id: F68
  claim: "Web fetch citations are optional and disabled by default; enable them explicitly."
  tag: VER
  url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-fetch-tool
  title: "Web fetch tool"
  source: anthropic-docs
  quote: "Unlike web search, where citations are always enabled, citations are optional for web fetch and disabled by default."
  accessed: 2026-11-19
  version_note: "Claude Platform web_fetch tool documentation accessed 2026-11-19; the documented current tool version was web_fetch_20260318."

- id: F69
  claim: "Claude Code combines up-front CLAUDE.md context with just-in-time file search, which can avoid stale indexing."
  tag: FACT
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  title: "Effective context engineering for AI agents"
  source: anthropic-engineering
  quote: "Claude Code is an agent that employs this hybrid model: CLAUDE.md files are naively dropped into context up front, while primitives like glob and grep allow it to navigate its environment and retrieve files just-in-time, effectively bypassing the issues of stale indexing and complex syntax trees."
  accessed: 2026-11-19

- id: F70
  claim: "Anthropic recommends a hybrid strategy that retrieves some data up front and allows autonomous exploration when useful."
  tag: REC
  url: https://www.anthropic.com/research/effective-context-engineering-for-ai-agents
  title: "Effective context engineering for AI agents"
  source: anthropic-engineering
  quote: "In certain settings, the most effective agents might employ a hybrid strategy, retrieving some data up front for speed, and pursuing further autonomous exploration at its discretion. The decision boundary for the ‘right’ level of autonomy depends on the task."
  accessed: 2026-11-19

- id: F71
  claim: "Anthropic recommends grounding factual work in direct quotes and checking claims against citations, retracting claims without support."
  tag: REC
  url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations
  title: "Reduce hallucinations"
  source: anthropic-docs
  quote: "Verify with citations: Make Claude’s response auditable by having it cite quotes and sources for each of its claims. You can also have Claude verify each claim by finding a supporting quote after it generates a response. If it can’t find a quote, it must retract the claim."
  accessed: 2026-11-19

- id: F72
  claim: "Claude's citations feature returns valid pointers to provided source documents."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/citations
  title: "Citations"
  source: anthropic-docs
  quote: "Better citation reliability: Because the API parses citations into the response formats described in the following sections and extracts cited_text directly, citations are guaranteed to contain valid pointers to the provided documents."
  accessed: 2026-11-19

- id: F73
  claim: "A document block's optional title and context fields are passed to Claude but are not cited from."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/citations
  title: "Citations"
  source: anthropic-docs
  quote: "title and context are optional fields that are passed to the model but not used toward cited content."
  accessed: 2026-11-19

- id: F74
  claim: "A successful Messages API response can stop because it reached the context window; this is distinct from a request error."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons
  title: "Stop reasons and fallback"
  source: anthropic-docs
  quote: "The `stop_reason` field is part of every successful Messages API response. Unlike errors, which indicate failures in processing your request, `stop_reason` tells you why Claude completed its response generation."
  accessed: 2026-11-19

- id: F75
  claim: "Changing a block at or before a prompt-cache breakpoint changes the prefix hash and can cause a cache miss."
