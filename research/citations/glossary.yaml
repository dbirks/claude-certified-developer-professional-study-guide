- id: F21
  claim: "A good request-based SLI can count successful requests or requests below a latency threshold."
  tag: STD
  url: https://sre.google/workbook/implementing-slos/
  title: "Implementing SLOs"
  source: standard
  quote: "Our availability SLI is the proportion of successful requests, and our latency SLIs are the proportion of requests that are faster than defined thresholds."
  accessed: 2026-11-19
- id: F22
  claim: "OpenTelemetry histograms are intended for statistically meaningful values such as percentiles."
  tag: STD
  url: https://opentelemetry.io/docs/specs/otel/metrics/api/
  title: "Metrics API"
  source: standard
  quote: "It is intended for statistics such as histograms, summaries, and percentile."
  accessed: 2026-11-19
- id: F23
  claim: "Precision is true positives over true plus false positives; recall is true positives over true plus false negatives."
  tag: STD
  url: https://scikit-learn.org/stable/auto_examples/model_selection/plot_precision_recall.html
  title: "Precision-Recall"
  source: standard
  quote: "Precision (P) is defined as the number of true positives (T_p) over the number of true positives plus the number of false positives (F_p)."
  accessed: 2026-11-19
- id: F24
  claim: "F1 is the harmonic mean of precision and recall with equal relative contribution."
  tag: STD
  url: https://scikit-learn.org/stable/modules/generated/sklearn.metrics.f1_score.html
  title: "f1_score"
  source: standard
  quote: "The F1 score can be interpreted as a harmonic mean of the precision and recall, where an F1 score reaches its best value at 1 and worst score at 0. The relative contribution of precision and recall to the F1 score are equal."
  accessed: 2026-11-19
- id: F25
  claim: "Cohen's kappa adjusts observed categorical agreement by chance-expected agreement."
  tag: STD
  url: https://scikit-learn.org/stable/modules/generated/sklearn.metrics.cohen_kappa_score.html
  title: "cohen_kappa_score"
  source: standard
  quote: "This function computes Cohen’s kappa [1], a score that expresses the level of agreement between two annotators on a classification problem. It is defined as \\[\\kappa = (p_o - p_e) / (1 - p_e)\\] where \\(p_o\\) is the empirical probability of agreement on the label assigned to any sample (the observed agreement ratio), and \\(p_e\\) is the expected agreement when both annotators assign labels randomly."
  accessed: 2026-11-19
- id: F26
  claim: "MDE is the minimum effect distinguishable from the null under stated design assumptions."
  tag: STD
  url: https://www.povertyactionlab.org/resource/power-calculations
  title: "Power calculations"
  source: other
  quote: "Minimum detectable effect (MDE): The smallest effect that, if true, has (1-β)% chance of producing an estimate that is statistically significant at the α% level (Bloom 1995). In other words, the MDE is the effect size below which we may not be able to distinguish that the effect is different from zero, even if it is."
  accessed: 2026-11-19
- id: F27
  claim: "A priori power analysis solves for sample size during planning."
  tag: STD
  url: https://en.wikipedia.org/wiki/Power_(statistics)
  title: "Power (statistics)"
  source: standard
  quote: "A priori power analysis is conducted prior to the research study, and is typically used in estimating sufficient sample sizes to achieve adequate power."
  accessed: 2026-11-19
- id: F28
  claim: "Little's law relates mean in-system work to arrival rate times mean residence time under steady state."
  tag: STD
  url: https://mathworld.wolfram.com/LittlesLaw.html
  title: "Little's Law"
  source: standard
  quote: "Little's law states that, under steady state conditions, the mean number of items in a queuing system equals the mean rate at which the items arrive multiplied by the mean time that an item spends in the system."
  accessed: 2026-11-19
- id: F29
  claim: "Google SRE recommends exponential backoff with jitter to dampen retry error amplification."
  tag: REC
  url: https://sre.google/sre-book/service-best-practices/
  title: "Production Services Best Practices"
  source: standard
  quote: "Every client that makes an RPC must implement exponential backoff (with jitter) for retries, to dampen error amplification."
  accessed: 2026-11-19
- id: F30
  claim: "Claude's SDK retries transient failures twice by default with exponential backoff and honors retry-after when present."
  tag: VER
  url: https://platform.claude.com/docs/en/api/errors
  title: "Claude API errors"
  source: anthropic-docs
  quote: "The official SDK automatically retries transient failures (such as connection errors, rate limits, and 5xx server errors) with exponential backoff, twice by default, honoring the retry-after header when present."
  accessed: 2026-11-19
  version_note: "Claude API errors page accessed 2026-11-19; SDK defaults may change."
- id: F31
  claim: "Pass^k measures the probability that all k trials succeed."
  tag: STD
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  title: "Demystifying evals for AI agents"
  source: anthropic-research
  quote: "pass^k measures the probability that all k trials succeed. As k increases, pass^k falls since demanding consistency across more trials is a harder bar to clear."
  accessed: 2026-11-19
- id: F32
  claim: "An observed pass^k estimate counts all-pass k-sized combinations among all k-sized combinations, averaged across tasks."
  tag: STD
  url: https://arxiv.org/html/2406.12045v1
  title: "τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains"
  source: other
  quote: "\\text{pass\\textasciicircum k}=\\mathbb{E}_{\\text{task}}\\left[\\binom{c}{k}\\middle/\\binom{n}{k}\\right]"
  accessed: 2026-11-19
- id: F33
  claim: "Pass@k measures probability that at least one of k generated samples passes unit tests."
  tag: STD
  url: https://arxiv.org/pdf/2107.03374
  title: "Evaluating Large Language Models Trained on Code"
  source: other
  quote: "To solve a problem in our test set, we generate multiple samples from the models, and check if any of them pass the unit tests."
  accessed: 2026-11-19
