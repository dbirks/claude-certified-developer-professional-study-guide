- id: F1
  claim: "An SLO has an indicator, goal, and evaluation period."
  tag: FACT
  url: https://docs.cloud.google.com/monitoring/api/ref_v3/rest/v3/services.serviceLevelObjectives
  title: "REST Resource: services.serviceLevelObjectives"
  source: other
  quote: "A Service-Level Objective (SLO) describes a level of desired good service. It consists of a service-level indicator (SLI), a performance goal, and a period over which the objective is to be evaluated against that goal."
  accessed: 2026-11-19
- id: F2
  claim: "An SLI is commonly defined as the ratio of good events divided by total events, such as successful requests over total requests."
  tag: STD
  url: https://sre.google/workbook/implementing-slos/
  title: "Implementing SLOs"
  source: standard
  quote: "While many numbers can function as an SLI, we generally recommend treating the SLI as the ratio of two numbers: the number of good events divided by the total number of events. For example: Number of successful HTTP requests / total HTTP requests (success rate)"
  accessed: 2026-11-19
- id: F3
  claim: "Burn rate measures how quickly service consumes its error budget relative to its SLO."
  tag: FACT
  url: https://sre.google/workbook/alerting-on-slos/
  title: "Prometheus Alerting: Turn SLOs into Alerts"
  source: standard
  quote: "Burn rate is how fast, relative to the SLO, the service consumes the error budget."
  accessed: 2026-11-19
- id: F4
  claim: "A burn rate of one consumes the error budget over the SLO window."
  tag: FACT
  url: https://sre.google/workbook/alerting-on-slos/
  title: "Prometheus Alerting: Turn SLOs into Alerts"
  source: standard
  quote: "With an SLO of 99.9% over a time window of 30 days, a constant 0.1% error rate uses exactly all of the error budget: a burn rate of 1."
  accessed: 2026-11-19
- id: F5
  claim: "The 50th percentile is the median."
  tag: STD
  url: https://www.itl.nist.gov/div898/handbook/prc/section2/prc262.htm
  title: "7.2.6.2. Percentiles"
  source: standard
  quote: "The 50th percentile is called the median. Percentiles split a set of ordered data into hundredths."
  accessed: 2026-11-19
- id: F6
  claim: "Percentile interpolation methods differ, so percentile dashboards should state the quantile method."
  tag: FACT
  url: https://www.itl.nist.gov/div898/handbook/prc/section2/prc262.htm
  title: "7.2.6.2. Percentiles"
  source: standard
  quote: "There is not a standard univerally accepted way to perform this interpolation."
  accessed: 2026-11-19
- id: F7
  claim: "Anthropic defines TTFT as elapsed time from prompt submission until the first generated token."
  tag: FACT
  url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency
  title: "Reducing latency"
  source: anthropic-docs
  quote: "Time to first token (TTFT): This metric measures the time it takes for the model to generate the first token of the response, from when the prompt was sent."
  accessed: 2026-11-19
- id: F8
  claim: "Anthropic distinguishes output tokens per second from TTFT as separate speed measures."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/fast-mode
  title: "Fast mode"
  source: anthropic-docs
  quote: "Speed benefits are focused on output tokens per second (OTPS), not time to first token (TTFT)"
  accessed: 2026-11-19
