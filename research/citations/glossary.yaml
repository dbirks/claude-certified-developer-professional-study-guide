  url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  title: "Prompt caching"
  source: anthropic-docs
  quote: "cache_creation_input_tokens: Number of tokens written to the cache when creating a new entry"
  accessed: 2026-11-19
