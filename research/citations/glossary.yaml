- id: F11
  claim: "Total Claude input tokens equal cache reads plus cache writes plus uncached input."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  title: "Prompt caching"
  source: anthropic-docs
  quote: "total_input_tokens = cache_read_input_tokens + cache_creation_input_tokens + input_tokens"
  accessed: 2026-11-19
- id: F12
  claim: "Claude input_tokens represents tokens after the last cache breakpoint, not all submitted input."
  tag: FACT
  url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  title: "Prompt caching"
  source: anthropic-docs
  quote: "The input_tokens field represents only the tokens that come after the last cache breakpoint in your request, not all the input tokens you sent."
  accessed: 2026-11-19
- id: F13
  claim: "Claude usage fields distinguish tokens written to cache and retrieved from cache."
