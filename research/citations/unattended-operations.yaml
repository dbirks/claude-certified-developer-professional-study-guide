- id: "F1"
  claim: "Claude Code -p runs non-interactively via the Agent SDK."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/headless#basic-usage"
  title: "Run Claude Code programmatically"
  source: "claude-code-docs"
  quote: "The Agent SDK gives you the same tools, agent loop, and context management that power Claude Code."
  accessed: "2026-11-19"
- id: "F2"
  claim: "JSON output includes the result, session ID and metadata; schema output needs validation."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/headless#get-structured-output"
  title: "Run Claude Code programmatically"
  source: "claude-code-docs"
  quote: "If a run ends without valid structured output, for example because Claude declined the request, the response has no structured_output field."
  accessed: "2026-11-19"
- id: "F3"
  claim: "Streaming uses newline-delimited event objects and a final result."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/headless#stream-responses"
  title: "Run Claude Code programmatically"
  source: "claude-code-docs"
  quote: "The last line of the stream is a result message with the final response text, cost, and session metadata."
  accessed: "2026-11-19"
- id: "F4"
  claim: "The print-mode turn cap defaults to unlimited."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/cli-reference"
  title: "CLI reference"
  source: "claude-code-docs"
  quote: "Limit the number of agentic turns (print mode only). No limit by default."
  accessed: "2026-11-19"
- id: "F5"
  claim: "The print-mode budget is an estimated per-invocation cap that may be exceeded."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/cli-reference"
  title: "CLI reference"
  source: "claude-code-docs"
  quote: "Claude Code checks the cap against its client-side cost estimate, which can differ from your bill. Spend from subagents counts toward the cap. Spend can pass the cap, so leave headroom."
  accessed: "2026-11-19"
- id: "F6"
  claim: "Specifying a permission mode chooses its starting policy."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/cli-reference"
  title: "CLI reference"
  source: "claude-code-docs"
  quote: "Accepts default, acceptEdits, plan, auto, dontAsk, bypassPermissions, or manual as an alias for default."
  accessed: "2026-11-19"
- id: "F7"
  claim: "Unattended runs can explicitly deny unresolved permission requests."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/headless#turn-off-permission-prompts-in-unattended-runs"
  title: "Run Claude Code programmatically"
  source: "claude-code-docs"
  quote: "Anything that would prompt is denied unless a PermissionRequest hook allows it, Claude is told that nobody can approve the request and not to retry it, and the run continues."
  accessed: "2026-11-19"
- id: "F8"
  claim: "Print runs load repository hooks and MCP configuration without trust prompts unless bare mode is used."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/headless#start-faster-with-bare-mode"
  title: "Run Claude Code programmatically"
  source: "claude-code-docs"
  quote: "Without --bare, a -p session runs the hooks in a project’s .claude/settings.json and connects the servers in its .mcp.json, even in a folder you’ve never trusted."
  accessed: "2026-11-19"
- id: "F9"
  claim: "Bare mode omits hooks even when explicitly passed through settings."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/headless#start-faster-with-bare-mode"
  title: "Run Claude Code programmatically"
  source: "claude-code-docs"
  quote: "Hooks still don’t run in bare mode when you pass them with --settings, or in the hooks/hooks.json or hooks manifest key of a plugin you load with a flag."
  accessed: "2026-11-19"
- id: "F10"
  claim: "The Agent SDK persists conversation history to disk rather than filesystem state."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/agent-sdk/sessions"
  title: "Work with sessions"
  source: "claude-code-docs"
  quote: "Sessions persist the conversation, not the filesystem."
  accessed: "2026-11-19"
- id: "F11"
  claim: "File checkpointing covers supported file tools, with limits for Bash and subagents."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/agent-sdk/file-checkpointing"
  title: "Rewind file changes with checkpointing"
  source: "claude-code-docs"
  quote: "File checkpointing tracks file modifications made through the Write, Edit, and NotebookEdit tools during an agent session, allowing you to rewind files to any previous state."
  accessed: "2026-11-19"
- id: "F12"
  claim: "Checkpoint IDs come from turn-start user message UUIDs and rewinding does not rewind conversation."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/agent-sdk/file-checkpointing#how-checkpointing-works"
  title: "Rewind file changes with checkpointing"
  source: "claude-code-docs"
  quote: "Each prompt that starts a turn is a checkpoint, and its user message’s UUID is the restore point."
  accessed: "2026-11-19"
- id: "F13"
  claim: "A Managed Agents idle checkpoint preserves sandbox state."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/managed-agents/events-and-streaming#resume-an-idle-session"
  title: "Session event stream"
  source: "anthropic-docs"
  quote: "When a session goes idle, Claude Managed Agents checkpoints its sandbox. The checkpoint preserves the full sandbox state, including the filesystem, installed packages, and any files the agent created."
  accessed: "2026-11-19"
- id: "F14"
  claim: "Managed session idle status alone is not sufficient to prove a workflow finished."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/managed-agents/session-operations#session-statuses"
  title: "Session operations"
  source: "anthropic-docs"
  quote: "A session can be idle while a workflow run is still open, so idle alone doesn’t mean that the work is done."
  accessed: "2026-11-19"
- id: "F15"
  claim: "A goal uses a separate model evaluator after each turn."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/goal"
  title: "Keep Claude working toward a goal"
  source: "claude-code-docs"
  quote: "/goal adds a separate evaluator that checks your condition after every turn, so completion is decided by a fresh model rather than the one doing the work."
  accessed: "2026-11-19"
- id: "F16"
  claim: "A goal can run in print mode and can be interrupted."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/goal#run-non-interactively"
  title: "Keep Claude working toward a goal"
  source: "claude-code-docs"
  quote: "Setting a goal with -p runs the loop to completion in a single invocation:"
  accessed: "2026-11-19"
- id: "F17"
  claim: "Session-scoped scheduled tasks restore on resume subject to expiry and exceptions."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/scheduled-tasks"
  title: "Run prompts on a schedule"
  source: "claude-code-docs"
  quote: "Tasks are session-scoped. When you resume with --resume or --continue, Claude Code restores tasks that haven’t expired, except those listed under Limitations."
  accessed: "2026-11-19"
- id: "F18"
  claim: "Recurring session tasks expire after seven days."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/scheduled-tasks#seven-day-expiry"
  title: "Run prompts on a schedule"
  source: "claude-code-docs"
  quote: "Recurring tasks automatically expire 7 days after creation. The task fires one final time, then deletes itself."
  accessed: "2026-11-19"
- id: "F19"
  claim: "Cloud scheduled tasks support API trigger with bearer token and return a session URL."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/routines#add-an-api-trigger"
  title: "Automate work with scheduled tasks"
  source: "claude-code-docs"
  quote: "POSTing to the endpoint with the task’s bearer token starts a new session and returns a session URL."
  accessed: "2026-11-19"
- id: "F20"
  claim: "API-triggered run text is labeled untrusted and must be referenced by the saved prompt."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/routines#trigger-a-scheduled-task"
  title: "Automate work with scheduled tasks"
  source: "claude-code-docs"
  quote: "It arrives wrapped in a <routine-fire-payload> block that labels it as untrusted data and tells Claude not to follow instructions inside it unless the routine’s own prompt says to."
  accessed: "2026-11-19"
- id: "F21"
  claim: "Cloud scheduled task events support PR, release and issue categories, not a documented CI check failure event."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/routines#supported-events"
  title: "Automate work with scheduled tasks"
  source: "claude-code-docs"
  quote: "Choose an event from any of the following categories. Within each category you can pick a specific action, such as pull_request.opened, or react to all actions in the category."
  accessed: "2026-11-19"
- id: "F22"
  claim: "Each scheduled run clones its repository and starts from the default branch unless specified."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/routines#repositories-and-branch-permissions"
  title: "Automate work with scheduled tasks"
  source: "claude-code-docs"
  quote: "Each repository you add is cloned on every run. Claude starts from the repository’s default branch unless your prompt specifies otherwise."
  accessed: "2026-11-19"
- id: "F23"
  claim: "The GitHub Action supports a prompt on GitHub events and uses the Agent SDK."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/github-actions"
  title: "Claude Code GitHub Actions"
  source: "claude-code-docs"
  quote: "You can also give the Claude Code GitHub Action a prompt to run automatically on any GitHub event."
  accessed: "2026-11-19"
- id: "F24"
  claim: "The action accepts prompt, credentials and CLI arguments."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/github-actions#pass-cli-arguments"
  title: "Claude Code GitHub Actions"
  source: "claude-code-docs"
  quote: "The claude_args parameter accepts any Claude Code CLI argument:"
  accessed: "2026-11-19"
- id: "F25"
  claim: "Plain-text action prompts need tools explicitly granted for shell and GitHub access."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/github-actions#run-on-a-schedule"
  title: "Claude Code GitHub Actions"
  source: "claude-code-docs"
  quote: "For a plain-text prompt, Claude has no shell or GitHub API access until you grant the tools the prompt needs, with --allowedTools in claude_args or a permissions.allow rule in the settings input."
  accessed: "2026-11-19"
- id: "F26"
  claim: "Notification hooks forward notification events and receive structured context."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/hooks#notification"
  title: "Hooks reference"
  source: "claude-code-docs"
  quote: "Notification hooks are intended for side effects such as forwarding the notification to an external service."
  accessed: "2026-11-19"
- id: "F27"
  claim: "Stop is a turn completion event, not a reliable error or interruption event."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/hooks#stop"
  title: "Hooks reference"
  source: "claude-code-docs"
  quote: "Runs when the main Claude Code agent has finished responding. Does not run if the stoppage occurred due to a user interrupt. API errors fire StopFailure instead."
  accessed: "2026-11-19"
- id: "F28"
  claim: "SIGTERM leaves the turn unfinished and kills active Bash process trees."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/headless#stop-a-run-with-sigterm"
  title: "Run Claude Code programmatically"
  source: "claude-code-docs"
  quote: "On SIGTERM, Claude Code terminates the process tree of any Bash command that is still running. Claude Code then runs SessionEnd hooks and exits."
  accessed: "2026-11-19"
- id: "F29"
  claim: "Remote MCP tasks may continue after print mode exits."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/headless#mcp-work-when-a-non-interactive-run-ends"
  title: "Run Claude Code programmatically"
  source: "claude-code-docs"
  quote: "MCP tasks: on a remote server the job goes on."
  accessed: "2026-11-19"
- id: "F30"
  claim: "Managed Agents scheduled shutdown also needs the deployment paused."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/managed-agents/secure-deployment"
  title: "Secure your Managed Agents deployment"
  source: "anthropic-docs"
  quote: "For a scheduled agent, also pause the deployment so that no new scheduled run starts. To end the schedule permanently, archive the deployment."
  accessed: "2026-11-19"
- id: "F31"
  claim: "Managed Agent deletion permanently deletes its event history and sandbox files."
  tag: "FACT"
  url: "https://platform.claude.com/docs/en/managed-agents/session-operations#deleting-a-session"
  title: "Session operations"
  source: "anthropic-docs"
  quote: "Deleting a session is permanent. It deletes the session’s record, events, and associated sandbox."
  accessed: "2026-11-19"
- id: "F32"
  claim: "Explicitly authorize only needed tools and review changes."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/github-actions#protect-your-credentials"
  title: "Claude Code GitHub Actions"
  source: "claude-code-docs"
  quote: "Grant the workflow only the permissions it needs, and review Claude’s changes before merging."
  accessed: "2026-11-19"
- id: "F33"
  claim: "In print mode auto-resume resets the budget accounting for earlier runs."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/cli-reference"
  title: "CLI reference"
  source: "claude-code-docs"
  quote: "When you return to a conversation with --continue or --resume, totals restored from earlier runs don’t count toward it."
  accessed: "2026-11-19"
- id: "F34"
  claim: "Cloud task connectors can write and all connected connectors are initially included."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/routines#create-from-the-web"
  title: "Automate work with scheduled tasks"
  source: "claude-code-docs"
  quote: "All of your connected MCP connectors are included by default. Remove any the task doesn’t need: Claude can use an included connector during a run, including writes."
  accessed: "2026-11-19"
- id: "F35"
  claim: "The Stop hook sees continuation status and the final assistant message."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/hooks#stop"
  title: "Hooks reference"
  source: "claude-code-docs"
  quote: "In addition to the common input fields, Stop hooks receive stop_hook_active, last_assistant_message, background_tasks, and session_crons."
  accessed: "2026-11-19"
- id: "F36"
  claim: "Allowed tools are preapproved; use --tools to restrict availability."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/cli-reference"
  title: "CLI reference"
  source: "claude-code-docs"
  quote: "To restrict which tools are available, use --tools instead."
  accessed: "2026-11-19"
- id: "F37"
  claim: "A workflow_run workflow requires a default-branch workflow file and can expose secrets to untrusted code."
  tag: "FACT"
  url: "https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run"
  title: "Events that trigger workflows"
  source: "other"
  quote: "Running untrusted code on the workflow_run trigger may lead to security vulnerabilities. These vulnerabilities include cache poisoning and granting unintended access to write privileges or secrets."
  accessed: "2026-11-19"
- id: "F38"
  claim: "Checkpoint UUIDs must be replayed into the SDK stream."
  tag: "FACT"
  url: "https://code.claude.com/docs/en/agent-sdk/file-checkpointing#implement-checkpointing"
  title: "Rewind file changes with checkpointing"
  source: "claude-code-docs"
  quote: "With the replay-user-messages option set, the user message for each prompt that starts a turn has a UUID that serves as a checkpoint."
  accessed: "2026-11-19"
- id: "F39"
  claim: "A rewind may skip unsafe paths and reports them."
  tag: "VER"
  url: "https://code.claude.com/docs/en/agent-sdk/file-checkpointing#how-checkpointing-works"
  title: "Rewind file changes with checkpointing"
  source: "claude-code-docs"
  quote: "RewindFilesResult counts every skipped path in its skippedLinks field."
  accessed: "2026-11-19"
  version_note: "Skipping requires Claude Code v2.1.216 or later."
- id: "F40"
  claim: "A workflow_run workflow file must exist on the default branch."
  tag: "FACT"
  url: "https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run"
  title: "Events that trigger workflows"
  source: "other"
  quote: "This event will only trigger a workflow run if the workflow file exists on the default branch."
  accessed: "2026-11-19"
