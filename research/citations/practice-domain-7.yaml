  title: "Hooks reference"
  source: claude-code-docs
  quote: "Either way, the prompt can still appear in local files such as the session transcript and your prompt history. A blocking hook isn't a way to keep a secret off disk."
  accessed: 2026-11-19

- id: F23
  claim: "MessageDisplay hooks change only on-screen display; transcripts and model context retain the original unredacted text."
