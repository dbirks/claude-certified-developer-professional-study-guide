- id: F18
  claim: "In Claude Code command hooks, exit code 1 without valid JSON output is a non-blocking error; policy hooks must use exit 2 (or JSON deny) to block."
  tag: FACT
  url: https://code.claude.com/docs/en/hooks#other-exit-codes
  title: "Hooks reference"
  source: claude-code-docs
  quote: "Exit code 1 without valid JSON output is a non-blocking error unless the hook is one whose failure blocks the action, even though 1 is the conventional Unix failure code. If your hook is meant to enforce a policy, use exit 2."
  accessed: 2026-11-19

- id: F19
  claim: "Setting onFailure to block on a command, http, or mcp_tool hook makes crashes, wrong script paths, and failures fail closed."
  tag: VER
  url: https://code.claude.com/docs/en/hooks#block-the-action-when-a-hook-fails
  title: "Hooks reference"
  source: claude-code-docs
  quote: "A policy hook with a wrong path or a crashing script then lets everything through. To block the action instead, set \"onFailure\": \"block\" on a command, http, or mcp_tool hook."
  accessed: 2026-11-19
  version_note: "onFailure: block requires Claude Code v2.1.295+ (command/http) or v2.1.328+ (mcp_tool)."

- id: F20
  claim: "Bash permission rules match the command text Claude writes after splitting compound commands and wrappers, so they miss alternate invocations and are not a security boundary."
  tag: FACT
  url: https://code.claude.com/docs/en/permissions#what-a-bash-rule-doesnt-match
  title: "Configure permissions"
  source: claude-code-docs
  quote: "A Bash rule matches the command text Claude writes, after Claude Code splits compound commands and strips wrappers. It doesn't match the same program invoked in a different form, so a deny or ask rule covers the invocation Claude usually produces and isn't a security boundary around the program."
  accessed: 2026-11-19

- id: F21
  claim: "Prompt instructions and CLAUDE.md shape what Claude attempts, whereas permission rules are enforced by Claude Code outside the model."
  tag: FACT
  url: https://code.claude.com/docs/en/permissions#manage-permissions
  title: "Configure permissions"
  source: claude-code-docs
  quote: "Permission rules are enforced by Claude Code, not by the model. Instructions in your prompt or CLAUDE.md shape what Claude tries to do, but they don't change these rules."
  accessed: 2026-11-19

- id: F22
  claim: "Blocking a prompt in UserPromptSubmit stops Claude from processing it, but the prompt can still persist in local transcript and prompt history files."
