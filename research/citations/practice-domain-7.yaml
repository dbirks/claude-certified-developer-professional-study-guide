  title: "Workload Identity Federation"
  source: anthropic-docs
  quote: "Your workload presents a signed JWT from your identity provider. Anthropic validates it against trust rules you configure in the Claude Console and returns a short-lived Anthropic access token bound to a service account in your organization."
  accessed: 2026-11-19

- id: F12
